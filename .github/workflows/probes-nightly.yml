name: probes-nightly

on:
  schedule:
    - cron: "30 19 * * *" # 03:30 Asia/Shanghai
  workflow_dispatch: {}

jobs:
  memorycore-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 仓库纪律（.gitignore:32-35）：lockfile 不入库（dev-only）——CI 无 frozen 安装、无依赖缓存
      # --ignore-scripts：openclaw 依赖链 preinstall 在 CI 沙箱失败（同 ci.yml 说明）
      - name: Install
        working-directory: MemoryCore
        run: pnpm install --ignore-scripts
      - name: Full identity probes (nightly, #48)
        working-directory: MemoryCore
        run: pnpm exec vitest run src/core/hooks/__tests__/soul-identity-probes.test.ts
      - name: Full test suite
        working-directory: MemoryCore
        run: pnpm exec vitest run

  memoryproxy-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: MemoryProxy
        run: pnpm install
      - name: Full test suite
        working-directory: MemoryProxy
        run: pnpm exec vitest run
