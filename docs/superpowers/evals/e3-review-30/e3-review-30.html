<script>
(function(){
var DATA = JSON.parse(document.getElementById('data').textContent);
var KEY = 'e3-review-143:' + DATA.meta.generatedAt;
var SUFF = ['sufficient','partial','insufficient','unsure'];
var SUFF_LABEL = {sufficient:'足够',partial:'部分足够',insufficient:'不足',unsure:'存疑'};
var BUCKET_LABEL = {refuse:'拒答过度',recall:'召回缺口',fold:'装配折叠',aggregation:'聚合精确数字',other:'其他'};
var state = load();
var filter = 'all';
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sysLabel(it){return it.precheck.systemClaim==='sufficient'?'足够':'不足';}
function agreeOf(it){
  var v = state[it.caseId]; if(!v || !v.sufficiency) return null;
  if(v.sufficiency==='unsure') return 'unsure';
  var human = (v.sufficiency==='sufficient'||v.sufficiency==='partial')?'sufficient':'insufficient';
  return human===it.precheck.systemClaim?'agree':'mismatch';
}
function cardHtml(it){
  var b=it.base, a=it.arm, p=it.precheck;
  var h='<div class="card" data-cid="'+esc(it.caseId)+'" data-stratum="'+esc(it.stratum)+'">';
  h+='<div class="head"><span class="idx">'+it.n+'</span><span class="cid">'+esc(it.caseId)+'</span>';
  h+='<span class="tag">'+esc(it.questionType)+'</span><span class="tag s">'+esc(it.stratumLabel)+'</span></div>';
  h+='<div class="q"><b>问</b> '+esc(it.question)+'</div>';
  h+='<div class="gold"><b>标准答案</b> '+esc(it.gold)+'</div>';
  h+='<div class="sys"><span>系统判定 <b>'+sysLabel(it)+'</b>（turnCov@5='+esc(b.tc5)+'）</span>';
  h+='<span>kept <b>'+esc(b.kept==null?'—':b.kept)+'</b></span><span>注入 <b>'+esc(b.injectedLines)+'</b> 行</span>';
  h+='<span>base 答对 <b>'+esc(b.genCorrect)+'</b> · 拒答 <b>'+esc(b.refused)+'</b></span>';
  if(a) h+='<span>arm 答对 <b>'+esc(a.genCorrect)+'</b> · 拒答 <b>'+esc(a.refused)+'</b> · kept '+esc(a.kept==null?'—':a.kept)+'</span>';
  h+='</div>';
  h+='<div class="meta">机器预检：'+esc(p.visibility)+' ｜ 归因提示：'+esc(p.bucketHint)+'</div>';
  if(p.foldSuspect) h+='<div class="meta"><span class="b miss">折叠嫌疑 jac='+esc(p.foldJaccard)+'</span> 同会话近重折叠把金句折掉（见「装配折叠」桶）</div>';

  if(!it.evidence.length) h+='<pre>本题无 has_answer 证据 turn（abstention/无据可查）</pre>';
  it.evidence.forEach(function(e,i){
    var badge = e.short?'<span class="b">短文本未匹配</span>':(e.inBlock?'<span class="b ok">已注入</span>':(e.inTop?'<span class="b warn">仅在 top-5</span>':'<span class="b miss">未召回</span>'));

    h+='<div class="tt">'+esc(e.text)+'</div></div>';
  });
  h+='</details>';
  h+='<details><summary>base 注入块（'+b.blockChars+' 字）</summary><pre>'+esc(b.block)+'</pre></details>';
  h+='<details><summary>base top-5</summary><pre>'+(b.topContents.length?esc(b.topContents.join('\n---\n')):'（空）')+'</pre></details>';
  if(a) h+='<details><summary>arm 注入块 / top-5（对照）</summary><pre>'+esc(a.block)+'</pre><pre>'+(a.topContents.length?esc(a.topContents.join('\n---\n')):'（空）')+'</pre></details>';

  h+='</select>';
  h+='<input class="reason" placeholder="一句话理由（不一致时写清：缺哪条证据 / 证据为何不够）">';
  h+='<span class="chip">未判</span></div></div>';
  return h;
}
function paintCard(card,it){
  var v=state[it.caseId]||{};
  card.querySelectorAll('input[type=radio]').forEach(function(r){r.checked=(r.value===v.sufficiency);});
  card.querySelector('.bucket').value=v.bucket||'';
  card.querySelector('.reason').value=v.reason||'';
  var chip=card.querySelector('.chip'); var ag=agreeOf(it);
  chip.className='chip '+(ag||'');
  chip.textContent = ag==='agree'?'一致':ag==='mismatch'?'不一致（系统'+(it.precheck.systemClaim==='sufficient'?'高报':'低报')+'）':ag==='unsure'?'存疑':'未判';
  card.className='card '+(ag==='agree'?'done':ag==='mismatch'?'mis':ag==='unsure'?'unsure':'')+(card.classList.contains('hide')?' hide':'');
  if(filter==='todo'&&ag) card.classList.add('hide');
  if(filter==='mismatch'&&ag!=='mismatch') card.classList.add('hide');
  if(filter==='agree'&&ag!=='agree') card.classList.add('hide');
  if(filter==='all') card.classList.remove('hide');
}
function paintAll(){
  var cards=document.querySelectorAll('.card'); var counts={judged:0,agree:0,mismatch:0,unsure:0};
  DATA.items.forEach(function(it,i){
    var card=document.querySelector('.card[data-cid="'+it.caseId+'"]'); if(!card) return;
    card.dataset.n=String(it.n); paintCard(card,it);
    var ag=agreeOf(it); if(!ag) return; counts.judged++; counts[ag]++;
  });
  document.getElementById('fill').style.width=(counts.judged/DATA.items.length*100)+'%';
  document.getElementById('progress').textContent='已判 '+counts.judged+'/'+DATA.items.length+' · 一致 '+counts.agree+' · 不一致 '+counts.mismatch+' · 存疑 '+counts.unsure;
}
document.getElementById('cards').innerHTML=DATA.items.map(cardHtml).join('');
document.addEventListener('change',function(ev){
  var card=ev.target.closest('.card'); if(!card) return; var cid=card.dataset.cid;
  var v=state[cid]||{};
  if(ev.target.type==='radio') v.sufficiency=ev.target.value;
  if(ev.target.classList.contains('bucket')) v.bucket=ev.target.value;
  if(ev.target.classList.contains('reason')) v.reason=ev.target.value;
  state[cid]=v; save(); paintAll();
});
document.addEventListener('input',function(ev){
  if(!ev.target.classList||!ev.target.classList.contains('reason')) return;
  var card=ev.target.closest('.card'); if(!card) return; var cid=card.dataset.cid;
  var v=state[cid]||{}; v.reason=ev.target.value; state[cid]=v; save();
});
function payload(){return {version:1,ticket:'#143',exportedAt:new Date().toISOString(),base:DATA.meta.base.file,arm:DATA.meta.arm.file,verdicts:state};}

  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='e3-review-143-verdicts.json'; a.click();
});
document.getElementById('copy').addEventListener('click',function(){
  var txt=JSON.stringify(payload());
  if(navigator.clipboard) navigator.clipboard.writeText(txt); else {var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
});
document.getElementById('reset').addEventListener('click',function(){
  if(!confirm('清空本机全部判定？导出的 JSON 不受影响。')) return;
  state={}; save(); paintAll();
});
document.querySelectorAll('button.f').forEach(function(btn){
  btn.addEventListener('click',function(){
    filter=btn.dataset.f; document.querySelectorAll('button.f').forEach(function(x){x.classList.toggle('on',x===btn);});
    document.querySelectorAll('.card').forEach(function(c){c.classList.remove('hide');});
    paintAll();
  });
});
document.querySelector('button.f[data-f="all"]').classList.add('on');
paintAll();
})();
