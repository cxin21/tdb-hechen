<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>灵魂星球 · 原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d6f0ff;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 22px; top: 20px; pointer-events: none; color: #1b3550; }
  #hud h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  #hud .sub { font-size: 11px; color: #5b7d9b; margin-bottom: 12px; }
  #badge { display: inline-block; margin-left: 8px; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; color: #9a6b18; border: 1px solid rgba(154,107,24,.35); vertical-align: 2px; }
  .lg-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #37536e; margin-bottom: 5px; }
  .lg-row i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; box-shadow: inset 0 -1px 0 rgba(0,0,0,.12); }
  .lg-row b { font-weight: 500; width: 30px; }
  .lg-row span { color: #6b8aa6; font-variant-numeric: tabular-nums; }
  #sel { margin-top: 8px; font-size: 12px; color: #c2410c; min-height: 16px; }
  #tip { position: fixed; left: 22px; bottom: 18px; font-size: 11px; color: #6e92ad; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <h1>灵魂星球<span id="badge">示例数据</span></h1>
  <div class="sub">四块大陆 · 地核为灵魂</div>
  <div id="legend"></div>
  <div id="sel"></div>
</div>
<div id="tip">拖拽旋转 · 滚轮缩放 · 点大陆看数据</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./planet.js"></script>
</body>
</html>
