# ============================================================
# TDAI Gateway 云端配置示例（tdai-gateway.yaml，腾讯云部署）
# 部署：cp deploy/tencent-cloud/config/core/tdai-gateway.cloud.yaml /opt/tdai/td-agemem/MemoryCore/tdai-gateway.yaml
# 密钥用 ${VAR} 占位（MemoryCore 支持环境变量展开，见 src/gateway/config.ts expandEnvVars）；
# 真实值放 /opt/tdai/etc/env（systemd EnvironmentFile），绝不提交仓库。
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "0.0.0.0"
  # P2-T13 鉴权必填（拍板③）：不配则每次启动生成临时密钥（本进程有效，重启更换），
  # 并在启动日志 loud 打印。跨进程调用方（MemoryProxy / Panel / 探针脚本）必须配置
  # 同一把 key（env TDAI_GATEWAY_APIKEY 或各自配置文件），否则一律 401。
  # apiKey: "your-key"  # 不配则每次启动生成临时密钥
  apiKey: "${TDAI_GATEWAY_API_KEY}"

# 数据落到 D 盘（避开 C 盘满问题）
data:
  baseDir: "/data/tdai-memory"

# ── LLM (必填; new-api 中转, 模型 scm-flash) ──
llm:
  baseUrl: "https://ark.cn-beijing.volces.com/api/coding/v3"
  apiKey: "${TDAI_LLM_API_KEY}" # deprecated 占位（ADR-0006）：展开为空则落 override（config-override.json）或 env 回退
  model: "ark-code-latest"
  maxTokens: 4096
  # 多提供商兼容：max_tokens 上限（按模型声明；缺省 131072=Ark 上限）
  maxTokensLimit: 131072
  timeoutMs: 120000

# ── Memory 引擎 (纯记忆, 不依赖 Skill) ──
memory:
  recallJournal:
    enabled: true
    rotationSizeMB: 5
    maxFiles: 5
  # D-3（2026-09-21，用户拍板"全做"）：敏感性标注提取门（A/B ev17b 开启；ev17a 为旧 prompt 对照基线）
  sensitivity:
    extractionEnabled: true
  promptMode: chat

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    # #79（2026-10-25 拍板）：dedup LLM 判重超时毫秒（clamp 60000..3600000；缺省 300000）。
    # 超时→快失败→既有 catch 走 storeAllDirectly 降级（l1-extractor.ts:528），防 300s 悬挂堆积静默死（2026-10-20 三连崩溃根修）。
    dedupTimeoutMs: 90000
    maxMemoriesPerSession: 20
    durativeEnabled: true # GROW-EVO P2（§2.2）：持续状态事实写 valid_start
    recurrenceEnabled: true # D-4（2026-09-22 拍板）：周期性事实 RECURRENCE_BLOCK 提取（LLM 只提议、确定性门裁决）
    # L1-OUTAGE-20261015：单次提取 LLM 调用超时 ms（思考型端点延迟∝prompt 体积，大批恒超时→游标不推进毒批死循环）；
    # 缺省 300000=逐位现状；clamp 60000..3600000。L1 提取与 L2 场景提取共用本键。
    # extractionTimeoutMs: 300000
    # #46 毒批拆分（2026-10-17 拍板 A）：scene 抽取失败且批内 >1 条时对半递归重试（镜像 L1 extractGroupWithSplit 先例）；缺省 false
    scenePoisonSplit: true
    # #46 批次上限：scene 抽取前按 memoriesJson 估长贪心预分批防巨批；缺省 0=关（单批现状）
    sceneBatchMaxChars: 20000
  # #28（R3，2026-10-17 用户拍板「都开」）：soul-state 观测门——抽取完成 seam 读 soul_state
  # →rollupStateFromRecords→写回（user_correction/tool_failure/task_switch 冲量 + 48h 半衰期）。
  # 开启后「当下的状态」尾块随真实行为积累（自然触发，零注入零删除，P1 安全）；缺省 false。
  extractionExtensions:
    enabled: true

  persona:
    triggerEveryN: 50
    maxScenes: 15
    # R4(2026-10-12): L2 场景提取关思考；A/B 30 次真调用 p50 −65%、整合率 2/10→10/10、质量代理持平
    reasoningEffort: "none"

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    # ── P0-2（issue #2 打分刻度错配，2026-10-13）──
    # native hybrid（TCVDB 服务端 RRF rerank k=60）返回 rank-only 融合分：单通道 top1≈
    # 1/61≈0.0164、双通道 top1≈0.0328（刻度自证 verify-t1.ts:202-203）——scoreThreshold
    # (0.3, 余弦刻度) 对 native 路形同虚设，结果从未被门槛过滤。nativeMinRRF 只约束
    # native 路（SQLite fallback 路仍走 scoreThreshold 全套精排）。
    # 0.016 ≈ 单通道 top-2（1/62≈0.0161 过 / 1/63≈0.0159 不过）或任意双通道融合命中
    # （≥2/69≈0.029）；0 = 关（逐位现状）。golden replay 校准后再调。
    nativeMinRRF: 0.016
    strategy: "hybrid"
    foldClusterEnabled: true  # F-CLUSTER v2 召回折叠（2026-09-30 转产：0b7ef5a 三层断点修复+A/B 5/10 触发实证）
    timeoutMs: 5000
    # ── 结构感知召回九通道（DS-RECALL-STRUCTURE-AWARE-001）→ 2026-09-12 实测关断 ──
    # 关断裁决（结构信号 on/off A/B，runs/2026-09-12T12-08-44 vs 12-11-49，同语料 1168 同 sha 92c4c8bc）：
    # on P@5=0.285 / off P@5=0.325，差 0.04 > 平手线 0.02；逐 query 归因：10 条中 8 条逐位中性、
    # 2 条有害（q9/q10 各被挤掉 1 条相关记忆）、0 条有益；分层旁证零反向漂移（CC/SD 逐位同，CTR off 略高）。
    # 依据"golden 实证降精度即关断"先例（beb2022 / router 退役 C3 同款）全量置 0；
    # 能力保留可重开（历史量级校准记录：RV2-1 ÷170 回 tiebreak 本位 2e-4~3e-4；CAL C2 六档）。
    # 重开前置：修复伤害模式后按漂移协议重跑 on/off A/B（预注册判据见 DS-P5-REANCHOR-001 §4.1）。
    timeBoost: 0               # R1 时间窗（关断实测有害：q9/q10 挤位）
    recencyBoost: 0            # R1 时近性（关断）
    sigWeight: 0               # R2 重要性（关断）
    inferredPenalty: 0.1       # R3 置信度分层：inferred 殿后旗标（GOLD-EVO P3 修正：三刀 5fc7962 后已从跨档乘法降为平局组内旗标，实际效果远弱于旧注释描述）
    reinforcementWeight: 0     # R8 强化闭环（关断）
    moodBoost: 0               # R9 mood-congruent 弱偏置（关断）
    graphMinStrength: 0.5      # R4 图一跳阈值旋钮（graphDiscount=0 时零调用；保留备重开）
    graphDiscount: 0           # R4 图一跳补池（关断实测有害）
    coreRefBoost: 0            # R5 价值驱动（关断；C1 coreRef 落盘与展示不受影响）
    sceneBoost: 0              # R6 场景路由（关断）
    # 性能速赢（TTL 置 0 = 关闭）
    queryEmbeddingCacheTtlMs: 60000   # E1：同 query 文本 60s 内复用向量（免重复外呼）
    valuesCacheTtlMs: 60000           # E2：价值锚缓存（五个写路径挂失效钩子；跨进程写漂移窗口=TTL）
    sessionReuseTtlMs: 300000         # E3：同 session 同 query 复用上轮注入块（5 分钟，空结果不缓存）
    # ── RV2-2 精排重设计（2026-09-11）→ P5 重锚裁决关断（2026-09-12，DS-P5-REANCHOR-001）──
    # compositeScore = wRel×relevanceNorm + wTime×timeProx + wSig×sigNorm + wCore×coreRefHit。
    # relevanceNorm：候选相关度分池内 max 归一（直接命中=fused score；图候选=派生分
    # maxHitScore×graphDiscount×pprNorm——同一量纲同尺度，E2.1 派生分即相关度折扣分）。
    # 契约：负值 clamp 0；全 0 = 关断恒等（基线融合排序）；relevance=0 = 退化纯时间/显著排序。
    # 历史：红牌轨迹 0.325→0.210→0.125→0.105（量纲失配降精度）；RV2-2 相关度主导修复后
    # 重锚实测（reanchor-2026-09-12T04-26-51.json，corpus/gitSha 双一致）仍降精度：
    # 精排 off P@5=0.285 / on P@5=0.160，差 0.125 > 平手线 0.02 → 工作点裁决 = off（关断）。
    # 新验收线 = 重锚基线 0.285 − margin 0.02 = P@5 ≥ 0.265（平面层体系；
    # 漂移重锚协议见 docs/superpowers/evals/memory-recall-golden/README.md）。
    # ── 三次重锚（2026-09-12 晚，排序三刀 5fc7962 落地后 A/B，触发条件 2：排序语义变更）──
    # 字典序新语义下复测：结构信号 on 0.325 / off 0.345（q9 挤位已被刀一修复、q10 平局组内
    # 重排仍有净伤害，每条 query off 均不劣于 on）→ 信号维持退役不回岗（spec §8.3）。
    # 工作点 = 纯基线；重锚基线 0.345（corpus 1176，runs/13-33-14；④ 完结重锚 runs/19-46-39
    # corpus 1246 精确复现 0.345，写副本 sidecar 首跑实证，线 0.325 重确认）。
    # 现行验收线：**P@5 ≥ 0.325**（= 0.345 − 0.02；同日三次换线均有据登记，数字巧合非复旧）。
    rerankWeights:
      relevance: 0
      timeProx: 0
      significance: 0
      coreRef: 0
    # ── R7 分层召回 · 结论层（审查修补 2026-09-12 登记；2026-09-12 显式打开 = 缺省值原样落盘）──
    excludeInvalidated: true
    emotionSalienceWeight: 0 # GROW-EVO P3 R10 实验轨：进预注册 A/B 队列，未过 A/B 不得置正
    conclusionLayer:
      enabled: true            # I① 结论层总开关（false = 结论层整体退出，输出与 R7 前基线逐位一致）
      maxCharsPerMemory: 2000  # 单条结论注入前截断字符数（0 = 不截断；Task CAL C1）
      cacheTtlMs: 300000       # I③ 幂等结论层缓存 TTL 毫秒（0 = 关；显式落盘 = 原"回落 sessionReuseTtlMs"的等价值）
      minUniqRatio: 0.35       # v18-c 结论块低密度门（何晨拍板「全做」2026-10-05）：句子级去重保留率下限，
                               # 低于阈值 = 自指回放块跳过取下一名（undefined/0 = 关逐位现状）
      # P1（issue #2，2026-10-13）：textHit 万词面 token 剔除——token 命中候选占比超过此值（0-1）
      # 视为通用词从 textHit 匹配集剔除（sceneHit 不受影响）。0 = 不启用。
      textHitMaxTokenRatio: 0.5
      # #53（2026-10-19）：L2 结论层 IDF 加权计分——true 时候选按 batch 相对 IDF
      # （idf(t)=ln(1+N/(1+df(t)))，万词面 token 天然低分）重排；层级序（work_fact>scene_block）
      # 不被反转，平分保调用方序。缺省 false = 调用方序逐位现状。
      idfWeighted: true
      # ── R71-A1（2026-10-19）：work_fact 结论候选 bm25 相关性地板——FTS5 raw rank 转相对分
      # rel/(1+rel) 后 < minBm25Rel 者在选择器前剔除（journal gates.conclusionBm25 记 kept/dropped）。
      # 6.5 = 2026-10-19 生产语料定标（docs/research/2026-10-19-r71-recall-relevance-design.md §3）；
      # 语料规模变化需重定标；缺省/0 = off。
      minBm25Rel: 6.5

    # ── #77 Batch C（survey F6b，2026-10-20 拍板开启）：检索期年龄衰减乘子 + 时间锚回退 ──
    # ageDecay：composite 打分 timeFactor 乘子 0.5^(ageDays/halfLifeDays)（floor 0.05；无时间锚不乘）。
    # 缺省 false=逐位现状；仅时间维度，零情绪数据（R-A 红线）。14d=现库 0-7d 龄区分度折中（决策包建议）。
    ageDecay:
      enabled: true
      halfLifeDays: 14
    # timeProxFallbackEnabled：composite timeProx 时间锚回退——occurred_at 缺失时用 created_at（写入
    # 时刻）兜底；不开则无 occurred_at 的记录 timeProx=0。效果与存量回填写库等价且零写库可逆
    # （决策包 2026-10-20-d2-d3 D2 选 B）。缺省 false=逐位现状。
    timeProxFallbackEnabled: true

    # ── #78 R-b（survey F4 small-to-big，2026-10-25 拍板开启）：结论卡父块回链读面 ──
    # enabled=true 时对 work_fact 结论卡按 part_of 身世边单跳回捞关联证据行，作预算内附加
    # 「上下文行」注入（[上下文|场景] 前缀）；maxExtraLines = 附加行全局帽（跨卡累计，0=关）。
    # 附加行挤经验层配额 ⇒ 注入总行数恒 ≤ maxResults（预算内附加）；软失败不阻断召回。
    # 缺省 false = 逐位现状；代码保守缺省关 + 部署 yaml 显式开（#77 三键同款惯例）。
    smallToBig:
      enabled: true
      maxExtraLines: 2

    # ── #54 动态 topK（分数分布 elbow，2026-10-19）──
    # enabled=true 时 R7 经验层按相似度分数分布自适应收缩注入条数：找最大单步落差
    # （argmax d(k)=pool[k-1]-pool[k]，全池 k∈[1,pool.length-1]），落差 ≥ dropRatio×span
    # （首分-末分）才切到 k，并 clamp max(切点, minTopK)——保底=注入下限，不是切点下限。
    # 刻度无关（纯相对落差，RRF/余弦皆可），scores 缺席（keyword FTS 路）不切。
    # journal「[dynamic-topk] elbow 收缩 X->Y」。minTopK clamp [1,50] 缺省 2；
    # dropRatio clamp [0.01,1] 缺省 0.5。缺省 false=逐位现状。
    dynamicTopK:
      enabled: true          # 生产已开
      minTopK: 2
      dropRatio: 0.5

    # ── 合并召回 · /v3/recall 核心单点（DS-RECALL-MERGE-001，2026-09-12）──
    # 端点返回与 auto-recall 钩子同一条组装路径（分层 + 预算 + 幂等结论层）产出的注入块；
    # MemoryProxy TdaiL1RecallInjector 改调本端点瘦传输（块直接前插），消灭两套组装逻辑。
    # 代理侧 404/5xx/超时自动降级旧路（/v3/atomic/search 自行组装）+ loud 日志。
    v3Recall:
      enabled: true        # 代码缺省 false（逐位现状，端点 404）；true = 瘦传输链路启用
      # #61（2026-10-18）：端点内召回超时毫秒。生产 5000→8000；proxy 侧 memory.timeoutMs 需同步 ≥ 此值
      # （否则 proxy 先断）。响应 meta.perfMs={total,scene,l2,l1,soul} 分段计时 + journal
      # [recall-perf] 行；2026-10-18 实测 L1 占 74%（含 embedding RTT）——容量优化靶在 L1/embedding。
      timeoutMs: 8000

    # ── 召回精排 rerank（P1 召回质量 spec §4.3，2026-10-13）——全部注释 = 缺省全关（零行为变化）──
    # 在 P0 召回门槛之上加云/本地精排：原 topK 候选扩池至 candidates → provider rerank →
    # minScore 门槛 → 取回 topK。失败/超时一律降级原序（精排永不阻断召回主链路）。
    # 开启即真实生效（shadowMode 已按用户 2026-10-14 拍板整体移除——无开关、无键；
    # journal.gates.rerank 仍记录 kept/dropped/topScore 供观测）。
    # rerank:
    #   enabled: false                    # 总开关（缺省 false = 逐位现状）
    #   provider: "siliconflow"           # siliconflow | dashscope | local(Task 3，暂关) | none
    #   apiKey: ""                        # 云端 provider 必填；缺失 → configError + 自动关断
    #   baseUrl: ""                       # 缺省 = provider 官方端点（siliconflow: api.siliconflow.cn；
    #                                     #   dashscope: dashscope.aliyuncs.com，业务空间专属域经此覆盖）
    #   model: ""                         # 缺省 = 推荐档（siliconflow: Qwen/Qwen3-Reranker-0.6B；
    #                                     #   dashscope: qwen3-rerank——gte-rerank v1 2026-05-30 下线勿选）
    #   timeoutMs: 800                    # 单次精排 HTTP 超时毫秒（负值 clamp 0 = loud 失败）
    #   candidates: 12                    # 送精排候选池大小（clamp [1,100]）
    #   minScore: -2.0                    # 相关度门槛（负值合法——local logits 刻度）
    #   local:                            # provider:"local"（Task 3 transformers.js）参数
    #     modelDir: ""                    # 缺省 = dataDir/models/reranker/Xenova/bge-reranker-base
    #     idleUnloadMs: 600000            # 空闲卸载毫秒（0 = 常驻）

    # ── worthiness importance 降权（P1 召回质量 spec §6，2026-10-13）——全部注释 = 缺省全关（零行为变化）──
    # 检索精排之后的「重要度」降权：仅惩罚 importance ≤4 的记忆（LLM 写入时评 1-10+理由，
    # 低价值=寒暄/流水账）；NULL/缺列不罚（宁缺毋滥：评不出来 ≠ 该罚）。开启即真实生效
    # （shadowMode 已按用户 2026-10-14 拍板整体移除；gates.importancePenalty 仍记录 raw/penalized 双分量）。
    # importancePenalty:
    #   enabled: false        # 总开关（缺省 false = 逐位现状）
    #   penalty: 0.3          # ≤4 记忆的乘法惩罚（clamp 上限 0.9；越大降权越狠）
    # 生产现值（2026-10-19 开门）：enabled: true + penalty 0.3——写侧 worthiness 配套，
    # 寒暄/流水账类低价值记忆在检索排序中真实降权。

    # ── 场景块治理（DS-SCENE-GOV-001，2026-09-12 生产启用）──
    # 提取批次后代码级超限守卫：块体 > maxBlockChars 触发 LLM 蒸馏重写，蒸馏失败码点安全硬截断兜底。
    # 启用依据：GOV-4 复核实证——守卫关闭时修复后 ~10 分钟内活跃提取管线把块体复涨破限
    # （7,728→8,754 且持续增长），时点修复不可持续；守卫启用是该设计闭环的完成动作。
    # 生产实证底座：分段蒸馏 6000 码点/片 + seg-cache + 空输出重试稳定跑通（spec §6 注记）。
    sceneGovernance:
      enabled: true           # 总开关（代码缺省 false = 逐位现状；此处生产显式开启）
      maxBlockChars: 8000     # 块体超限阈值（码点数；clamp [500, 100000]；GOV-4 定档见 spec §6）
      distillTimeoutMs: 60000 # 蒸馏 LLM 调用超时毫秒（负值 clamp 0；0 = runner 缺省超时）
      hardCapChars: 20000     # 蒸馏失败兜底硬截断上限（clamp 下限 = maxBlockChars）

  # ── worthiness 写入面（P1 召回质量 spec §6，2026-10-13）——缺省 false = 逐位现状 ──
  # true = L0→L1 提取在既有单次 LLM 调用里顺带产出 IMPORTANCE_BLOCK（1-10+≤20 字理由）；
  # 关闭时 prompt 字节逐位不变、importance 字段缺席=召回不罚。越界/畸形分由确定性门拒绝
  # （不 clamp 不伪造）。面板可对单条记忆手动调级（/atomic/importance，source=manual）。
  # worthiness:
  #   extractionEnabled: true   # 生产已开（2026-10-19 开门）：LLM 顺带产出 importance 字段（写侧）；
  #                             # 与 recall.importancePenalty（读侧消费）配套。

  storeBackend: "sqlite"

  embedding:
    provider: "openai_compatible"
    baseUrl: "https://ark.cn-beijing.volces.com/api/coding/v3"
    apiKey: "${TDAI_LLM_API_KEY}" # 与 llm 同源（Ark）；embedding env 优先不受 ADR-0006 影响；如需独立 embedding key 请替换
    model: "doubao-embedding-vision"
    dimensions: 2048
    # #61（2026-10-18）：仅召回链路的 embedding 专用超时 ms（undefined = 回落 timeoutMs）。
    # embedding 慢时到点断开 → hybrid 自动退化 FTS（degraded 标注 recallDegradedFtsOnly），
    # 用延迟换可用性。
    recallTimeoutMs: 2000

  bm25:
    enabled: true
    language: "zh"

  # ── 真记忆 G–M 新增配置（config-first，全部开启） ──
  links:
    enabled: true # G 记忆图：接入时为 l1_links 建边（merge→similar / update→evolve）
    minSimilarity: 0.3  # similar 边最低相似度门槛（S1：缺省 0.3，越界 clamp [0,1]；显式落盘 = 缺省值原样）
  coreMemory: # K 核心记忆写入口信任边界（审计 F2）；价值锚纯自发现（GROW-MAINT，B1 种子已退役）
    # S-FEEL-1（M1，2026-09-24 何晨拍板启用；A/B 13/13 全过）
    moodLine:
      enabled: true
    # S-CHAR-2（M2，2026-09-24 何晨整句授权自定最优启用；A/B 10 组全过+生产快照 17 租户实证）
    characterTension:
      enabled: true
      minInstances: 2
      maxCandidatesPerPass: 2
    writeEnabled: true # 允许经 /v3/core-memory/write 写（slot 白名单内）
    allowedSlots: [identity, core_value, strict_rule, self_identity] # P1(DS-SOUL-MEMORY-002): +agent 自我层(写入仍由 selfIdentity.enabled 门控)
    maxContentLength: 2000
    # GROW-MAINT（2026-09-15 拍板）：不再灌种子；价值锚 = LLM 自发现（提议制+护栏）+ 自维护
    # （低证据退场 / 权重随语料演化）。minEvidence 显式 3（小语料期可达；提案区下限对齐）。
    anchorDiscovery:
      enabled: true
      minEvidence: 3
      maxPerPass: 2 # P3 散项回切（2026-09-24 整句授权）：FLOW-TEST 演示值 3→登记值 2
      maxTotal: 15
      intervalHours: 24
      maintainIntervalHours: 6 # V10-MAINT-DECOUPLE（2026-09-25 何晨拍板「全部按建议」）：维护面独立节奏小时数（0=每 tick；缺省 6）
      # DS-SOUL-MEMORY-002 P2（spec §2.6/§5）：人物锚分池（同一 worker 策略化分叉）——
      # p- 前缀独立命名空间 / 别名维度去重 / QUOTA 分池（人物 maxTotal=6 独立于主题 15（2026-10-04 拍板 character 8→6 回归设计值 §7.2））。
      person:
        enabled: true
        minEvidence: 3 # 与 theme 对齐（小语料期可达；T9 实证：缺省 5 挡掉 3 条女儿语料）
        maxPerPass: 2
        maxTotal: 6
      # P2：GROW-MAINT 身份分支（F15 身份分支）——失撑身份事实只警告永不自动退场（F20 红线）。
      identityMaintain:
        enabled: true

      # P3：品格锚池（聚合源=self_identity 槽事实，spike 定案）
      character:
        enabled: true
        minEvidence: 3
        maxPerPass: 2
        maxTotal: 6
    # DS-SOUL-MEMORY-002 P1: agent 自我层(灵魂双槽)——双视角自发现 + 四段渲染
    selfIdentity:
      enabled: true
      maxPerPass: 2
      intervalHours: 24 # P3 散项回切（2026-09-24 整句授权）：验收期冷却 1→登记值 24
    soulRender:
      budgetSelfChars: 600
      budgetIdentityChars: 900
      maxRelationLines: 5 # F17（审计补齐）：重要的人 行数上限；5=原行为显式落盘
      # #10 T4：三行锚列表总长预算（整锚粒度从尾丢，不截半句）。0=关（缺省逐位现状）。
      # 建议放量值：锚行 480（≈10 锚当量）、人物行 400、品格行 300。
      budgetAnchorChars: 0
      budgetPersonChars: 0
      budgetCharacterChars: 0
      # #42（D9 情境锚选择器，确定性 embedding 相似度，不上 LLM 打分）：
      # scorer.enabled=true 打分链路通电（embedding=共享 EmbeddingService）；threshold=0 无硬门；
      # shadowSink 每轮渲染都采集锚分分布（#52 P3 已与裁剪报告门解耦，渲染字节零变化），
      # 数据供 D9 定标：#57 analyze:anchor-shadow 实测 0.2 为无损收紧带、0.3 断崖。
      anchorSelect:
        maxRows: 12
        scorer:
          enabled: true
          threshold: 0
        shadowSink:
          enabled: true
          file: "/data/tdai-memory/logs/soul-anchor-shadow.jsonl"  # 云端路径；本地为 D:/TDB/data/logs/…
      # #40（ADR0003 票 B）：capabilities 渲染门——「## 我能做什么」段；清单由 proxy /v3/recall body 传入
      capabilities:
        enabled: true
      # #52 D3：per-turn soul 块省略（我是谁）/（我心中的他）两行（system 侧 core_memory 块已承载同内容）；
      # false = 省略模式（生产现状）；缺省 true = 每轮渲染（旧行为）；legacy（dual=false）路径不受影响
      perTurnSlots: false
      # #67（R3 身份叙事层，2026-10-19）：identity/self_identity 两槽确定性叙事化门——
      # true=soul dual 路径身份两行由 renderIdentityNarrative 叙事段替代（模板常量+事实句
      # 逐字，无 LLM/随机/时钟；生成闸违例或无身份内容→条目渲染兜底），且 /v3/core-memory/read
      # 支持 format=narrative（身份两槽折叠为 identity_narrative 合成槽，proxy 经 API 透传）。
      # Park 2411.10109 口径：条目存储+叙事渲染并存；strict_rule/价值锚不动；缺省 false。
      identityNarrative:
        enabled: true
      # #41（D8 证据迁移门）：user 确认话语白名单→refKey 严格相等的 open promise 迁移；
      # 承诺创建通道由 lifecycle.reflection.promiseProposals→人工采纳承载（LLM 无直改路径）
      promiseEvidence:
        enabled: true
      # T3（未来性渲染面）：「我的承诺：」块注入 soul-identity（品格后红线前）；
      # 最新 3 条 open 承诺逐字渲染（零 open 整块省略=宁缺毋滥，不伪造）
      promises:
        enabled: true
      # #55（S17，2026-10-19）：soul 渲染近重复去重门（config-first 缺省关，布局级变更不翻 soulVersion）——
      # strictRuleDedup：红线段近重复行收敛（exact/jaccard≥0.45/containment≥0.9，保长=归一后更长，
      # winner 原位替换）；anchorDedup：价值锚 label 双向包含且短侧 ≥2 字护栏（完整句优先）。
      # 生产 A/B 实证：14→13 红线（R03 环境铁律短变体并入 R08）、根因→根因优先。
      strictRuleDedup:
        enabled: true          # 生产已开；jaccardThreshold 缺省 0.45
      anchorDedup:
        enabled: true          # 生产已开
  lifecycle:
    enabled: true # H+I：巩固 + 遗忘的周期调度（每 10 分钟一轮，best-effort）
    intervalMs: 600000
    consolidation:
      enabled: true
      persist: true # H：把巩固出的持续态写为一个 observed/work_fact L1 记录
      minCount: 3
      minSpanDays: 1
      subjectStrategy: llm # P3-T17（拍板④）：subject 归组策略门——llm=dedup 顺带抽取的语义 subject 优先、词法兜底（默认）；lexical=纯词法前缀
    forgetting:
      refProtection: true # P2（F14）：refs 遗忘保护——coreRefs/personRefs/identityRefs 命中仍有效锚或现行身份事实的记录不进归档候选（悬空 refs 不保护）
      recurrenceProtection: true # D-4（2026-09-22 拍板）：metadata.recurrence（normalize 形状）的周期性事实不进归档候选
      enabled: true # I：遗忘判定（宁漏勿多；归档标软删，不真删）
      minAgeDays: 30
      lowThreshold: 0.12
      arousalRetention: 0.3 # GROW-EVO P3（§3.1）：闪光灯调制 k（缺省 0 = 逐位现状）
    # P3-F13：反思触发（Generative Agents 对标；缺省 off）
    reflection:
      enabled: true
      rRef: 2 # 刻度换算：Generative Agents 0-100 刻度的 150 ≈ 本库 significance [0,1] 刻度的 1.5；取 2.0≈3 条高显著记录
      # #44（D8-(c) 提案通道）：reflection 同调用产 promiseTransitions→vet（verbatim≥12 等）→
      # dedup→pending 轨（slot=promise_transition）；人工 Panel/API decide adopted→唯一写入口。
      promiseProposals:
        enabled: true
      # #27（S6 反思结论→身份层提案安全门）：slot 白名单 [identity,self_identity]、verbatim≥12 逐字拒绝、
      # O13 pending→人工采纳；strict_rule 不可提案。缺省 false=零提案。
      soulProposals:
        enabled: true
        # D7 ε shadow 定标：行为零变化，仅旁路记录 bestLen 分布至 data/logs/soul-reflection-shadow.jsonl。
        # 注意嵌套层级：config.ts 从 soulProposals 组内解析（与 soulProposals 平级=不生效）。
        shadowCalibration:
          enabled: true
        # #60（S22 反思产物契约门，2026-10-19）：LLM 仅提议+确定性校验（第一人称叙事、禁伪造当下体验
        # /我(现在|此刻|当下)(的)?(感到|觉得|感觉|情绪)/、≤200 字、价值锚引用校验锚集来自 core_value 行）——
        # 契约不通过拒绝推提案；通过时 anchor_refs 并入提案 attrs。缺省 false=现状。
        cardContract:
          enabled: true       # 生产已开
        # #77 Batch D（survey F1，2026-10-20 拍板开启）：结论卡拆条引导——反思 LLM prompt 附加
        # 「一句话一件事/≤300 码点/多事拆条/宁缺毋滥」few-shot；≤300 码点机械拒收门已无条件生效
        # （validateConclusionCard，拒收记 skipped 警告日志），本键只加引导降拒收率。缺省 false=逐位现状。
        conclusionContract:
          enabled: true

  evolution: # 受控正文演化（GROW-EVO §4，REG-REMAINING-005 #1）——全系统唯一允许改写已固化正文的路径
    enabled: true # P4b 验证通过后开启（2026-09-17 live 验证轮；五条件门+单轮上限护栏，门严=不触发良性）
    maxRewrites: 3
    intervalMs: 3600000
  search:
    neighborExpand: # J：重构式回忆——图邻居扩展（宁缺毋滥，仅并入 top 种子之邻）
      enabled: true
      maxHop: 1
      maxAdd: 3

# Skill 模块（standalone 本地启用）
#  - contentBackend: local → 数据存 {baseDir}/skills/，无需 COS。
#  - routing.mode: bm25     → embedding 不可用(none)时自动降级 bm25，非阻塞。
#  - extraction.enabled: true → 启用 LLM 自动抽取（抽取器+LLM 都在跑才有产出，见官方文档）。
skill:
  enabled: true
  storeBackend: "sqlite"
  contentBackend: "local"
  routing:
    mode: "bm25"
    searchTopK: 20
  extraction:
    enabled: true # 官方：开启 LLM 自动抽取（之前为 false 导致 0 产出）
    maxIterations: 16 # review agent 最大迭代（官方模板默认 16）
    archiveBytes: 40960 # 40KB 归档阈值（工具调用 ≥10 或 字节 ≥40KB 触发归档）
    # O8 拍板 2026-09-17：超大对话（~40KB 归档阈值）提取超 120s 为确定性失败而非瞬时故障，
    # 曾被无界 transient 重试。以下两旋钮 0 = 不限制（llm-runner GROW-EVO P2.1 语义，
    # params 显式 0 覆盖 runner 级 llm.timeoutMs/maxTokens 缺省）。
    timeoutMs: 0
    maxTokens: 0

# 可观测性本地关闭
observability:
  otel:
    enabled: false
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: false
