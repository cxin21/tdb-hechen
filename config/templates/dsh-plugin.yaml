# ============================================================================
# dsh-plugin 配置模板 — DSH 宿主进程内插件（无独立端口；随 profile 的 cordis patch 装载）
# 真源：dsh-plugin/src/config.ts（DEFAULT_CONFIG :323-472 / normalizeConfig :579-705）+ dsh-plugin/src/config-schema.ts；
#       本模板与之逐键对齐，由 scripts/check-config-templates.mjs 校验
# 用法：整段粘进 profile 的 cordis.patch.yml 里本插件条目的 config: 块；⚠ 该块是整块替换、不深合并 ——
#       漏写一个键就回落代码缺省，不是「沿用上一份」
# 敏感值：用凭据引用名（server.apiKeyRef / server.userKeyRef）或 ${ENV_NAME} 占位，真实值只进 D:/TDB/etc/env.ps1；
#         宿主不会展开 ${...}，真值字段要自己替换；本模板不含任何明文 key
# 说明：对象节点（server / volatile / ...）单独成行只为 YAML 容器，四要素注释只覆盖叶子键；
#       consumed=false 的 6 个键在注释里标了「孤儿」，明细见 config/templates/dsh-plugin.keys.json
# ============================================================================
enabled: true   # bool default=true — 插件总开关；false 时 apply() 直接 return，不注册任何段/工具、不建 outbox（连 debug 日志镜像都不建） [src:414]

# ─── server ───────────────────────────────────────────────  [config.ts:416]
# server 连接与身份（core 基址 / 凭据引用名；三段隔离身份只在 patch 里，不在设置页）
server:
  baseUrl: "http://127.0.0.1:8420"   # str default="http://127.0.0.1:8420" — core 的 origin（结尾斜杠会被剥掉）；指向错端口时所有调用 fail-open 成「没有记忆」，不会报错 [src:416]
  apiKey: ""   # str default="" — 内联 core API key；非空时压过 apiKeyRef。桌面 profile 无凭据库时才用，填错=全量 401 后进程级停用 [src:418]
  apiKeyRef: "TDAI_GATEWAY_APIKEY"   # str default="TDAI_GATEWAY_APIKEY" — 凭据名（不是值）：依次查 credentials seam → 同名环境变量。指向 proxy 的 key 会让每次 core 调用静默 401 [src:420]
  serviceId: "default"   # str default="default" — 作为 x-tdai-service-id 发出；换值等于换一个服务命名空间 [src:421]
  userKey: ""   # str default="" — 内联用户 key（task-51 身份解析）；非空时压过 userKeyRef。只用于 verify→team/list→agent/list，绝不进日志/提示词 [src:423]
  userKeyRef: "TDAI_USER_KEY"   # str default="TDAI_USER_KEY" — 用户 key 的凭据名；留空且无内联值时退化为「只用三轴显式身份」 [src:424]
  teamId: ""   # str default="" — 隔离轴之一；不在设置页里（身份由 user key + 用户级 session_init 决定），只由 patch 兜底写入；空串且解析不成功时插件保持 inert [src:427]
  agentId: ""   # str default="" — 隔离轴之一；不在设置页里，只由 patch 兜底写入；与 teamId/userId 任一为空即 inert [src:428]
  userId: ""   # str default="" — 隔离轴之一；不在设置页里，只由 patch 兜底写入；三轴齐备才发数据路由，也才带 x-tdai-user-key [src:429]
  requestTimeoutMs: 10000   # ms default=10000 — 单次 HTTP 的握手+响应总预算（clamp [100,120000]）；太小会把正常写入拖成超时死信 [src:432]
  maxResponseBytes: 2097152   # int default=2097152 — 单次响应体的字节上限（源码 2 * 1024 * 1024，clamp [1,16777216]）；0/缺省=用缺省，绝不等于「不限」 [src:435]

# ─── paths ────────────────────────────────────────────────  [config.ts:438]
# HTTP 路径（换后端要整体改，单改一条即 404）
paths:
  coreRead: "/v3/core/read"   # path default="/v3/core/read" — core 只读路径；换后端要整套一起改，单改一条会 404 [src:438]
  atomicSearch: "/v3/atomic/search"   # path default="/v3/atomic/search" — /v3/recall 不可用时的回退检索路径 [src:439]
  scenarioLs: "/v3/scenario/ls"   # path default="/v3/scenario/ls" — L2 场景索引列表路径（headPack.includeScenarioIndex / l2Chars 的取数口） [src:440]
  conversationAdd: "/v3/conversation/add"   # path default="/v3/conversation/add" — L0 回写路径（一期蒸馏管线） [src:441]
  conversationDelete: "/v3/conversation/delete"   # path default="/v3/conversation/delete" — L0 删除路径 [src:442]
  skillConversationAdd: "/v3/skill/conversation/add"   # path default="/v3/skill/conversation/add" — 二期技能管线的回写路径，与 conversationAdd 不可互换（喂不同蒸馏器） [src:443]
  recall: "/v3/recall"   # path default="/v3/recall" — 合并召回路径；服务端 v3Recall.enabled=false 时这里会 404 并回退 atomicSearch [src:444]
  health: "/health"   # path default="/health" — 健康探针路径；填错只影响探测，不影响召回 [src:445]
  metaAuthVerify: "/v3/meta/auth/verify"   # path default="/v3/meta/auth/verify" — 用户 key 换身份的第一步（公开读，不需 x-tdai-user-key） [src:446]
  metaTeamList: "/v3/meta/team/list"   # path default="/v3/meta/team/list" — 第二步：列可访问 team（需 x-tdai-user-key） [src:447]
  metaAgentList: "/v3/meta/agent/list"   # path default="/v3/meta/agent/list" — 第三步：列 agent；三步任一失败则身份维持空、插件 inert [src:448]
  metaUserConfig: "/v3/meta/config/user/get"   # path default="/v3/meta/config/user/get" — 第四步：读该用户的 session_init 配置（preset/bypass/ask 三态输入）；读失败按 ask 处理，绝不拦住回合 [src:449]

# ─── headPack ─────────────────────────────────────────────  [config.ts:452]
# 人格头包（DEPLOYMENT_PERSONA_SUFFIX 段）：身份 / 场景索引 / 技能清单的入口
headPack:
  enabled: true   # bool default=true — 是否注入「人格头包」段；关掉后模型只拿到 volatile 记忆块 [src:452]
  orderOffset: 100   # int default=100 — 在宿主 DEPLOYMENT_PERSONA_SUFFIX 段序上加的偏移；越大越靠后 [src:453]
  maxChars: 20000   # int default=20000 — 头包整段字符上限；超了按行裁，设太小会把 L2 索引挤掉 [src:458]
  timeoutMs: 10000   # ms default=10000 — 拉取头包的单次预算（floor 100）；超时走竞态，本轮无头包 [src:459]
  refreshMs: 300000   # ms default=300000 — 头包刷新间隔（floor 100）；越小越新但每轮多一次请求 [src:460]
  fallbackText: ""   # str default="" — 从未成功拉到头包时的兜底文案；空=直接不注入（fail-open） [src:461]
  includeScenarioIndex: true   # bool default=true — 是否把 L2 场景索引渲染进头包；关掉后模型不知道有哪些 scene_blocks/ 文件 [src:462]
  maxScenarioEntries: 20   # int default=20 — composeHeadPack 自带路径列表的旧上限；task-103 后 persona 不再用它 ⇒ 现行无实际效果（孤儿） [src:463]
  l2Chars: 3000   # int default=3000 — L2 索引段的字符上限（clamp [0,3000]，3000 与段自身 L2_MAX_CHARS 对齐）；按行裁，放不下的整行丢 [src:465]

# ─── volatile ─────────────────────────────────────────────  [config.ts:468]
# volatile 注入块：每轮 <relevant-memories> 的预算与分片
volatile:
  enabled: true   # bool default=true — 是否每轮注入 <relevant-memories> 块；关掉后 soul/wiki/knowledge 也一起没了 [src:468]
  maxChars: 6000   # int default=6000 — 每轮注入块总上限（clamp [200,20000]）；6000 = 4400 人格 + ~900 记忆 + ~700 段（ADR-0019：1500 装不下 16 条红线） [src:480]
# · volatile.soul 子段
  soul:
    enabled: true   # bool default=true — 是否注入 <soul-identity> 人格碎片（蒸馏出的红线/身份） [src:482]
    maxChars: 4400   # int default=4400 — 人格块上限（clamp [100,6000]）；实测整段渲染 4309 字符（16 条红线全在），从 volatile.maxChars 里切 [src:488]
    includeFeeling: true   # bool default=true — 是否连 <soul-feeling>（情绪行，36–40 字符）一起注入 [src:489]
    oncePerSession: true   # bool default=true — 同一会话只注入一次人格（按 soulVersion 判重，版本变了再注入）；关掉=每轮都注入，用 token 换稳定性 [src:493]
  timeoutMs: 3000   # ms default=3000 — 整块取数预算（含回退腿，floor 100）；超了本轮注入空块 [src:497]
  recall: true   # bool default=true — 优先走 /v3/recall；false 强制走 atomic/search 老通道（没有 soul/结论层） [src:498]
  recallMaxResults: 3   # int default=3 — 交给 /v3/recall 的 maxResults；实测 3 与 2 都只装 2 条（预算先到），调大不加钱但也不加条 [src:499]
  recallTimeoutMs: 2500   # ms default=2500 — 仅 /v3/recall 的预算（AbortController 真取消，floor 100）；家测 P50 4260ms ⇒ 缺省值下过半轮次回退 [src:504]
# · volatile.wiki 子段
  wiki:
    enabled: false   # bool default=false — 是否注入 <team-wiki> 段；8420 上 /v3/wiki/search 长期 404，缺省关=省一次每轮失败请求 [src:508]
    topK: 3   # int default=3 — 合并后保留条数（clamp [1,20]） [src:509]
    perWikiLimit: 4   # int default=4 — 向 core 请求的单 wiki 扇出（clamp [1,20]） [src:510]
    minScore: 0.02   # float default=0.02 — 传给 core 的相关度下限（clamp [0,10]），本地不再二次过滤；调高后段可能空 [src:511]
    maxChars: 800   # int default=800 — wiki 段字符上限（clamp [0,2000]，0=不注入）；还得与主块预算抢余量 [src:512]
    timeoutMs: 2500   # ms default=2500 — 单次 wiki 调用预算（floor 100） [src:513]
# · volatile.knowledge 子段
  knowledge:
    enabled: true   # bool default=true — 是否注入 <knowledge_tools> 段（团队知识库清单） [src:519]
    maxChars: 3000   # int default=3000 — 该段字符上限（clamp [0,3000]，0=不注入） [src:520]
    maxResources: 8   # int default=8 — 最多渲染几个知识资源（clamp [1,32]） [src:521]
    timeoutMs: 2500   # ms default=2500 — 单次 /v3/knowledge/list 预算（floor 100） [src:522]

# ─── writeback ────────────────────────────────────────────  [config.ts:526]
# 回写（outbox → /v3/conversation/add）：容量、重试、硬顶
writeback:
  enabled: true   # bool default=true — 是否把每轮对话回写 core（L0/L2 蒸馏的入口）；关掉后记忆不再增长 [src:526]
  skillFeed: true   # bool default=true — 是否同时喂二期技能管线；同一身份已被 MemoryProxy 喂过时要设 false，否则每次交互被蒸馏两遍 [src:528]
  outboxPath: ""   # path default="" — 本地 outbox JSONL 路径；空=派生 $DSH_HOME/agemem/outbox.jsonl [src:529]
  maxAttempts: 8   # int default=8 — 单条消息重试次数上限（floor 0）；到顶进死信，不再重试 [src:530]
  retryMs: 30000   # ms default=30000 — 重试间隔（floor 100）；调小会放大 core 故障期的请求量 [src:531]
  maxMessageChars: 8192   # int default=8192 — 单条消息字符上限（clamp [1,8192]）；超了 core 用 400 拒整批，所以这里是硬顶不是建议 [src:535]
  maxMessagesPerRequest: 100   # int default=100 — 单请求消息数上限（clamp [1,100] 对齐 core v2-schemas）——注意：归一化后运行期无消费者，批次大小实际无人限制（孤儿） [src:536]
  maxRequestBytes: 700000   # int default=700000 — 单请求体字节上限（源码 DEFAULT_MAX_REQUEST_BYTES=700000，clamp [1,1000000]）；超过 1MB core 直接 RST，本轮丢失 [src:538]
  maxOutboxEntries: 500   # int default=500 — outbox 条数容量（clamp [1,100000]）；越界丢最老的并 warn，死信不参与裁剪 [src:541]
  maxOutboxBytes: 20971520   # int default=20971520 — outbox 文件字节容量（源码 20 * 1024 * 1024，clamp [1024,1e9]）；与条数上限谁先到算谁 [src:542]

# ─── tools ────────────────────────────────────────────────  [config.ts:545]
# 模型工具面：recall / knowledge 的可用性
tools:
  enabled: true   # bool default=true — 是否向模型暴露记忆工具（recall/knowledge）；关掉后只剩被动注入 [src:545]
  recall: true   # bool default=true — 是否单独暴露 memory_recall 工具 [src:546]
  recallTopK: 8   # int default=8 — memory_recall 的缺省 top_k；调大只加 token 不加召回质量 [src:547]

# ─── identity ─────────────────────────────────────────────  [config.ts:552]
# 
identity:
  askAtSessionStart: true   # bool default=true — 总开关：关掉=完全不读用户级配置、不弹卡（纯静态三元组/自动化模式；已记住的绑定仍生效） [src:552]
  followUserSessionInit: true   # bool default=true — 是否遵循用户级 session_init：true=preset/bypass 静默生效、ask 弹卡；false=跳过读配置一律弹卡（老行为） [src:555]
  askTimeoutMs: 60000   # ms default=60000 — 等人点卡片的上限（clamp [1000,300000]）；到点 abort 并记 skipped，绝不卡住回合 [src:558]
  rememberSession: true   # bool default=true — 绑定是否写盘跨重启保留（按 session id，最多 200 条，超出淘汰最旧的） [src:559]
  skipDefault: false   # bool default=false — 把「跳过」放到选项第一位 [src:560]
  statePath: ""   # path default="" — 绑定状态文件；空=与 outbox 同目录的 session-identity.json；rememberSession=false 时只留内存 [src:561]

# ─── skill ────────────────────────────────────────────────  [config.ts:590]
# 技能面（task-72）：头包段 + 六个读写工具
skill:
  enabled: true   # bool default=true — 技能面总开关（头包段 + 工具）；关掉后模型看不到团队技能库 [src:590]
  allowLlmWrite: false   # bool default=false — 是否暴露六个写工具（create/patch/delete 共享团队技能）；缺省关=只读，破坏性操作要显式开 [src:592]
  headPackChars: 8000   # int default=8000 — <available_skills> 段字符上限（clamp [0,64000]）；8000≈90 个技能名 [src:594]
  searchTopK: 10   # int default=10 — skill_search 缺省 top_k（clamp [1,50]） [src:595]
  maxResultChars: 20000   # int default=20000 — 单个工具结果回给模型的字符上限（clamp [1000,60000]）；现实测单个技能头 30318 字符 [src:598]
  timeoutMs: 2500   # ms default=2500 — 每次 /v3/skill/* 预算（floor 100） [src:599]

# ─── assetReflection ──────────────────────────────────────  [config.ts:604]
# 资产反思段（task-82）——已实现但未接线，改值不产生行为
assetReflection:
  enabled: true   # bool default=true — 资产反思段总开关；但注册函数 src 零调用点 ⇒ 现行改值无行为（task-107 已登记） [src:604]
  triggerToken: "/analyse"   # str default="/analyse" — 触发 token（空白会被归一化回缺省）；同上未接线，改值无行为 [src:606]
  alwaysOn: false   # bool default=false — 评测会话用：忽略 token 每轮注入；同上未接线 [src:607]
  maxChars: 600   # int default=600 — 反思块字符上限（clamp [120,4000]）；同上未接线 [src:610]

# ─── services ─────────────────────────────────────────────  [config.ts:567]
# 服务栈看护（ADR-0022）：插件自己拉起 + 健康门 + 崩溃重拉三服务，替代外部 tdb-lifecycle bundle 与 PowerShell 看护进程
services:
  enabled: false   # bool default=false — 是否由插件拉起并看护 TDB 服务栈（core 8420 / knowledge 8421 / panel 8123）；缺省关＝谁启动栈是部署决定，升级插件绝不顺带起三个 node 进程 [src:567]
  repoRoot: "D:/TDB/td-agemem"   # str default="D:/TDB/td-agemem" — 仓库根：三个服务目录（MemoryCore / MemoryKnowledge / MemoryPanel）由它派生；指错＝启动即报目录不存在 [src:568]
  envFile: "D:/TDB/etc/services.env"   # str default="D:/TDB/etc/services.env" — 服务栈环境变量文件（KEY=VALUE，支持 ${VAR}）：插件与手工 PowerShell 路径读同一份；每次 spawn 重读，换 key 下次重启即生效 [src:571]
  nodePath: ""   # str default="" — 跑服务的 node 可执行文件；空=宿主自己的 node。服务以 --import tsx 启动，只要求 tsx 支持该版本 [src:574]
  logteeModule: "file:///D:/TDB/etc/logtee.mjs"   # str default="file:///D:/TDB/etc/logtee.mjs" — 应用层日志镜像模块（file: URL）：cmd 重定向对长驻 detached 进程会静默丢写，故用 --import 在进程内镜像到 TDAI_LOG_FILE [src:577]
  logDir: "D:/TDB/data/logs"   # path default="D:/TDB/data/logs" — 每服务每代一份 <name>-<stamp>.out.log / .err.log，另有 .tee.log 应用层镜像；健康门失败的错误里会给出这个目录 [src:578]
  runDir: "D:/TDB/data/run"   # path default="D:/TDB/data/run" — 状态文件所在目录（谁占着 pid、restartsUsed 记在哪）；与 logDir 分开，日志可随时清 [src:579]
  statePath: ""   # path default="" — 空=runDir/tdb-services.state.json。刻意不用旧 supervisor 的文件名：那个进程可能还活着并在写同一文件 [src:582]
  controlPort: 8444   # int default=8444 — 控制面端口（只绑 127.0.0.1，0=随机）；POST 需 X-Tdb-Control: 1 头，浏览器同源路由 /tdb-lifecycle/* [src:583]
  healthTimeoutMs: 90000   # ms default=90000 — 单个服务等 /health 200 的预算（clamp [5000,600000]）；core 冷启要跑 jieba/embedding 预热，给短了会误判失败 [src:584]
  maxRestarts: 3   # int default=3 — 子服务崩溃自动重拉次数上限（clamp [0,50]）；用尽后写 failed[] 并停手，不再无限重拉 [src:585]
  autoRestart: true   # bool default=true — 关掉＝只负责启动、进程死了不重拉（调试用）；restart 控制接口也会因此拒绝 [src:586]
  stopOnDispose: true   # bool default=true — 宿主退出时是否连带停掉自己拉起的服务；false=detach（状态写成 hostPid:0 后走人，下次不回收） [src:587]

# ─── 其余顶层开关 ───────────────────────────────────────────────  [config.ts:612]
# 调试通道：不起时零副作用；开了才有 verbose 日志与文件镜像
debug: false   # bool default=false — 打开 verbose 日志 + 文件镜像；未显式写布尔时由环境变量 AGEMEM_DEBUG 决定（不为空且非 0/false/no/off 即 true） [src:612]
debugLogFile: ""   # path default="" — debug 日志镜像路径；空=派生 DSH_HOME/agemem/agemem.log（5MB 轮转为 .1）；GUI 宿主唯一可观测通道 [src:614]
