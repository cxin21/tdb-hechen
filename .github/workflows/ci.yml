name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  memorycore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 仓库纪律（.gitignore:32-35）：lockfile 不入库（dev-only）——CI 无 frozen 安装、无依赖缓存
      # --ignore-scripts：openclaw 依赖链 preinstall 在 CI 沙箱失败（本地 patch 脚本本有 || true 兜底）；
      # esbuild 平台二进制走 optionalDependencies 分发，源码 vitest 门不受影响
      - name: Install
        working-directory: MemoryCore
        run: pnpm install --ignore-scripts
      - name: Redline subset probes (PR gate, #48)
        working-directory: MemoryCore
        run: pnpm exec vitest run src/core/hooks/__tests__/soul-identity-probes.test.ts -t "红线子集"
      - name: Full test suite
        working-directory: MemoryCore
        run: pnpm exec vitest run

  memoryproxy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: MemoryProxy
        run: pnpm install
      - name: Typecheck
        working-directory: MemoryProxy
        run: pnpm exec tsc --noEmit
      - name: Full test suite
        working-directory: MemoryProxy
        run: pnpm exec vitest run
