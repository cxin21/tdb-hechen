# ============================================================================
# MemoryCore 配置模板 — 8420 / 单进程 standalone（deployMode: standalone）
# 真源：MemoryCore/src/config.ts（memory.* 解析）+ MemoryCore/src/gateway/config.ts（网关段）
#       + MemoryCore/src/core/skill/skill-config.ts（skill 缺省）+ MemoryCore/tdai-gateway.yaml（现网值）
#       本模板与之逐键对齐，由 scripts/check-config-templates.mjs 校验（格式契约见 config/SPEC.md）
# 用法：复制到 MemoryCore/tdai-gateway.yaml（或 TDAI_GATEWAY_CONFIG 指向的路径）后按需删段改值。
#       值列 = 源码缺省（密钥类写成 ${ENV} 占位），因此全量拷贝 = 与源码缺省同构、不改变行为；
#       唯一例外是「硬坑 A」的 0 与删键语义差别，以及被 env/config-override.json 覆盖的键。
#   注意：对象块（recall.fusion / factChannel / conclusionLayer.rerankGate 等）在本模板里是『块存在、子键为 null』，
#   与源码『整块缺键』在个别 Object.keys(x).length===0 判空处**不等价**；行为仍在缺省档，但要逐位复现
#   生产形态请整块删除（删块不影响 checker 的键集合，键仍写在本模板里）。
# 敏感值：一律 ${ENV_NAME} 占位，真实值只进 D:/TDB/etc/env.ps1
#   （占位符不会被任何加载器替换：拷贝后必须填真实值，或删掉该键走缺省/环境变量）
# 每条键的注释： # <类型> default=<源码缺省> — <作用> [src:<文件>:<行号>]
#   default=unset 表示该键可选：不写=undefined（键不存在），写 null 与不写等价。
# ============================================================================

# 段名说明：skill 是顶层段；memory.skill 是**别名位置**（gateway 把顶层 skill 浅合并后镜像到 memory.skill，
#   src/gateway/config.ts:617-624），因此运行时能看到成对的 memory.skill.* 叶子，模板只写顶层 skill。
# ─── 读这份模板前必须知道的四条（顺序即优先级）────────────────────────────────
# 1) 优先级链（左高右低）：请求级 settings（/v3/recall body.settings 等）
#      > env 读取器（MemoryCore/src/utils/env-config.ts，仅文末「env-only」列出的键）
#      > D:/TDB/data/config-override.json（白名单覆盖：llm / embedding / rerank /
#        importancePenalty / worthiness / extraction.scenePoisonSplit / extraction.sceneBatchMaxChars，
#        见 MemoryCore/src/gateway/settings-override.ts，合并点 MemoryCore/src/gateway/config.ts:501-519）
#      > 本文件 yaml > 源码缺省（MemoryCore/src/config.ts parseConfig）
#    ⇒ 改了 yaml 不见效时，先看 config-override.json 与 env.ps1，别先怀疑 yaml 没被读到。
# 2) 【硬坑 A】0 ≠ 删键：memory.recall.weights.* 的折扣/加权项（graphDiscount / sceneBoost /
#    coreRefBoost 等同族）写 0 = 显式关闭该通道；删键或写 null = 回落源码缺省（可能非 0）
#    ⇒ 通道反而被打开。要关就显式写 0，永远不要用「不写」表达关闭。
# 3) 【硬坑 B】未知枚举值 fail-secure，不回落：memory.auth.requireTeamOwnership 拼成 "enfroce"
#    ⇒ 判为 enforce（数据面 403 TEAM_NOT_OWNED）；memory.auth.unknownPrincipalPolicy 拼错 ⇒ reject；
#    memory.wiki.teamVerify 拼错 ⇒ enforce；memory.recall.injectWrapper.mode 未知 ⇒ 回落 calibrated。
#    想用缺省请写空串或删键。改档后复测两个入口：/v3/conversation/add 与 /v3/core/read。
# 4) 【硬坑 C】memory.extraction.enabled 不是有效闸：gateway 路径无条件构建 StatefulPipelineManager
#    （MemoryCore/src/gateway/server.ts:2500-2510 / :2548-2572），L1 照常入队并真的调 LLM。
#    能让后台流水线停转的是 memory.lifecycle.enabled（server.ts:2609 早退）与
#    skill.enabled（server.ts:3095-3099 池闸）。

# ─── env-only 变量（不进 yaml；读取点 MemoryCore/src/utils/env-config.ts）────────
#   MEMORY_LOG_LEVEL(:64)  MEMORY_MAX_BODY_BYTES(:79)
#   VDB_ENDPOINT/VDB_APIKEY/VDB_DATABASE/VDB_COLLECTION…(:95-:102)
#   COS_SECRET_ID/COS_SECRET_KEY/COS_REGION/COS_BUCKET…(:116-:158)
#   TDAI_API_TRACE_ENABLED(:166)  V3_STRICT_ISOLATION(:186，缺省开；未知值按开处理)
#   MEMORY_AUTH_REQUIRE_USER_BINDING(:202)  MEMORY_AUTH_UNKNOWN_PRINCIPAL_POLICY(:210)
#   MEMORY_AUTH_ADMIN_BYPASS_ENABLED(:218)  MEMORY_AUTH_REQUIRE_TEAM_OWNERSHIP(:230)
#   MEMORY_AUTH_TEAM_OWNERSHIP_WHITELIST(:238，逗号分隔；**覆盖**而非合并 yaml 白名单)
#   GATEWAY_API_KEY 由 resolveApiKey(:252) 读取；未配则本进程随机生成（重启后旧 key 全失效）
#   TDAI_SKILL_ENABLED / TDAI_SKILL_WORKER_CONCURRENCY / TDAI_GATEWAY_CONFIG / TDAI_DEPLOY_MODE /
#   STATE_BACKEND / TDAI_DATA_DIR 见 src/gateway/config.ts 的 env 读取处

# ─── 部署与进程 ───────────────────────────────
#                              [src:MemoryCore/src/gateway/config.ts]
deployMode: "standalone"  # enum(standalone) default="standalone" — 仅剩 standalone（单进程自包含）；service 档在 Wave 2 整组退场，写非 standalone 启动即抛错（docs/adr/0021） [src:MemoryCore/src/gateway/config.ts:455]
stateBackend: null  # enum(local) default=unset — 仅剩 local（进程内文件/内存）；redis 档在 Wave 2 整组退场，写非 local 启动即抛错（docs/adr/0021） [src:MemoryCore/src/gateway/config.ts:466]
instanceId: null  # str default=unset — 实例 ID；standalone 下缺省 default（service 档已随 Wave 2 退场）；请求头 x-tdai-service-id 可逐调用覆盖 [src:MemoryCore/src/gateway/config.ts:477]
server:
  port: 8420  # int default=8420 — HTTP 监听端口；env TDAI_GATEWAY_PORT 优先 [src:MemoryCore/src/gateway/config.ts:256]
  host: "127.0.0.1"  # str default="127.0.0.1" — 监听地址；非回环且未配 apiKey 时启动 WARN（裸奔暴露） [src:MemoryCore/src/gateway/config.ts:257]
  apiKey: "${TDAI_GATEWAY_APIKEY}"  # str default=unset — /health 之外所有路由的 Bearer 密钥；不配则启动生成临时 key（重启失效，日志 loud 打印）；env 优先 [src:MemoryCore/src/gateway/config.ts:267]
  corsOrigins: []  # list<str> default=[] — CORS 白名单；[]=不发 Access-Control-* 头（最严，缺省）；["*"]=放行全部(仅本地) [src:MemoryCore/src/gateway/config.ts:775]
data:
  baseDir: null  # path default=unset — 数据根：sqlite/vectors/journal/skills/config-override.json 都在其下；env TDAI_DATA_DIR 优先 [src:MemoryCore/src/gateway/config.ts:272]
llm:
  # ─── LLM（顶层）──────────────────────────────
  #  优先级：config-override.json > yaml > TDAI_LLM_* env(普通字段)，见上方优先级段
  #                              [src:MemoryCore/src/gateway/config.ts]
  baseUrl: "https://api.openai.com/v1"  # str default="https://api.openai.com/v1" — LLM 端点（OpenAI 兼容）；env TDAI_LLM_BASE_URL 优先；provider=proxy 时运行期拼 /proxy/<iid>/v1 [src:MemoryCore/src/gateway/config.ts:287]
  apiKey: "${TDAI_LLM_API_KEY}"  # str default="" — LLM 密钥；实际 SoT=config-override.json(admin settings)，yaml 次之，env TDAI_LLM_API_KEY 仅弃用回退 [src:MemoryCore/src/gateway/config.ts:290]
  model: "gpt-4o"  # str default="gpt-4o" — 默认模型名；env TDAI_LLM_MODEL 优先 [src:MemoryCore/src/gateway/config.ts:291]
  maxTokens: 4096  # int default=4096 — 单次 LLM 输出 token 上限；0=不限制（reasoning 模型建议 0，4096 帽会截成空响应） [src:MemoryCore/src/gateway/config.ts:292]
  timeoutMs: 120000  # ms default=120000 — 单次 LLM 调用超时毫秒 [src:MemoryCore/src/gateway/config.ts:293]
  provider: "openai"  # enum(openai|proxy) default="openai" — openai=直连兼容端点；proxy=走 context_proxy 且 Authorization 用 memory 系统用户 key [src:MemoryCore/src/gateway/config.ts:382]
  stream: false  # bool default=false — 是否流式；env TDAI_LLM_STREAM=true/false 可覆盖（显式关也可） [src:MemoryCore/src/gateway/config.ts:300]
shark:
  baseUrl: null  # str default=unset — Shark 远端配置服务地址（service 模式拉实例配置） [src:MemoryCore/src/gateway/config.ts:482]
  vdbTtlMs: 300000  # ms default=300000 — 远端 VDB 配置缓存 TTL [src:MemoryCore/src/gateway/config.ts:483]
  cosBufferMs: 120000  # ms default=120000 — COS 配置缓冲刷新间隔 [src:MemoryCore/src/gateway/config.ts:484]
  maxInstances: 1000  # int default=1000 — 本地缓存的实例上限（store maxStores 同源） [src:MemoryCore/src/gateway/config.ts:485]
scanner:
  instances: "default"  # str default="default" — TimerScanner 扫描实例列表（逗号分隔） [src:MemoryCore/src/gateway/config.ts:491]
  intervalMs: 500  # ms default=500 — 扫描周期；越小定时任务越准时、DB 压力越大 [src:MemoryCore/src/gateway/config.ts:493]
  nodeId: null  # str default=unset — 节点 ID（多副本分片认领，缺省按主机生成） [src:MemoryCore/src/gateway/config.ts:494]
worker:
  pollMs: 200  # ms default=200 — PipelineWorker 轮询间隔 [src:MemoryCore/src/gateway/config.ts:500]
  concurrency: 60  # int default=60 — worker 并发协程数；调大提吞吐也压 DB/LLM 配额 [src:MemoryCore/src/gateway/config.ts:501]
cos:
  domain: null  # str default=unset — COS 访问域名（自定义 CDN 时配） [src:MemoryCore/src/gateway/config.ts:507]
  generationLogRetentionDays: 30  # int default=30 — 生成日志保留天数；0=关闭生命周期管理；非负整数，非法直接启动抛错 [src:MemoryCore/src/gateway/config.ts:509]
observability:
  type: "noop"  # enum(noop|console) default="noop" — 观测后端类型；otel/clickhouse/kafka/langfuse 四个块已在 Wave 3（docs/adr/0021）整块退场，块内 enabled=true 启动即抛错 [src:MemoryCore/src/gateway/config.ts:521]
metadata:
  # ─── 元数据模块（users/teams/存储）──────────
  maxUsersPerInstance: 500  # int default=500 — 单实例用户配额；<=0 回落 500 [src:MemoryCore/src/gateway/config.ts:578]
  maxTeamsPerInstance: 100  # int default=100 — 单实例 team 配额；<=0 回落 100 [src:MemoryCore/src/gateway/config.ts:582]
  configParamsFile: null  # path default=unset — metadata config params JSON 文件路径（env TDAI_METADATA_CONFIG_PARAMS_FILE 优先） [src:MemoryCore/src/gateway/config.ts:585]
  store:
    sqliteBaseDir: null  # path default=unset — metadata sqlite 根目录（缺省 {data.baseDir}/metadata） [src:MemoryCore/src/gateway/config.ts:566]
    storeCacheMaxInstances: null  # int default=unset — metadata store 进程内缓存实例上限 [src:MemoryCore/src/gateway/config.ts:567]
    mongoDbPrefix: "tdai_metadata"  # str default="tdai_metadata" — Mongo 库名前缀，库名 = {prefix}_{instance_id} [src:MemoryCore/src/gateway/config.ts:568]
  systemUser:
    memory:
      userId: null  # str default=unset — 内部 memory 系统用户 user_id（仅 auth/verify，不落库） [src:MemoryCore/src/gateway/config.ts:587]
      displayName: null  # str default=unset — 系统用户显示名 [src:MemoryCore/src/gateway/config.ts:588]
      userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}"  # str default=unset — 系统用户 userKey（llm.provider=proxy 时作为 Authorization 凭据） [src:MemoryCore/src/gateway/config.ts:587]
memory:
  # ─── memory：prompt / 捕获 / 抽取 / 写面 / 场景 / 管线 ──────────
  #                              [src:MemoryCore/src/config.ts（c = yaml 的 memory 段）]
  promptMode: "chat"  # enum(chat|code) default="chat" — 全局 prompt 家族；chat=对话体、code=代码体；组级 extraction.promptMode/persona.promptMode 可覆盖；顶层 promptMode 与 prompts.mode 是别名 [src:1533]
  capture:
    excludeAgents: []  # list<str> default=[] — 不捕获的 agent 名单（按 agent_id 精确匹配） [src:2266]
    l0l1RetentionDays: 0  # int default=0 — L0/L1 保留天数；<=0=关闭清理；1~2 天须同时开 allowAggressiveCleanup 才生效；>=3 直接生效 [src:1539]
    allowAggressiveCleanup: false  # bool default=false — 允许 retentionDays<3 的激进清理（1~2 天） [src:1540]
    cleanTime: "03:00"  # str default="03:00" — 每日清理时刻 HH:mm（本地时区）；格式非法回落 03:00 [src:1634]
  extraction:
    enabled: true  # bool default=true — L1 抽取总开关（注意：gateway 路径下不是有效闸，只影响 legacy manaCTD；真闸是 pipeline/lifecycle） [src:1996]
    enableDedup: true  # bool default=true — 入库前 LLM 判重合并（相似记忆合并防膨胀） [src:2272]
    maxMemoriesPerSession: 20  # int default=20 — 单会话单批最多抽取条数（防 LLM 失控灌库） [src:2273]
    sessionScope: "session"  # enum(session|profile) default="session" — 抽取语料会话范围；session=只抽最靠前的一个 session_id（其余延后，零丢行）；profile=旧多会话同批；非法值回落 session [src:2275]
    durativeEnabled: false  # bool default=false — 持续性状态事实写 valid_start（缺省关=prompt 字节不变） [src:2277]
    recurrenceEnabled: false  # bool default=false — 周期性事实 RECURRENCE_BLOCK 提取（LLM 只提议、确定性门裁决） [src:2279]
    model: null  # str default=unset — 抽取专用模型名；不写=继承 llm.model [src:2280]
    promptMode: "chat"  # enum(chat|code) default="chat" — 抽取 prompt 家族；缺省跟随全局 promptMode [src:2281]
    extractionTimeoutMs: 300000  # ms default=300000 — 单批抽取超时；clamp [60000,3600000]（毒批 300s 悬挂堆积的根修） [src:2285]
    dedupTimeoutMs: 300000  # ms default=300000 — 判重 LLM 超时；clamp [60000,3600000]；超时走 storeAllDirectly 降级 [src:2288]
    ignoreSessionPatterns: ["probe-","session-probe-"]  # list<str> default=["probe-","session-probe-"] — 命中这些模式的会话不参与 L1 抽取、不计 batch；匹配=前缀+* 通配，对 session_id 与 sessionKey 双生效；写 []=关闸 [src:2291]
    scenePoisonSplit: false  # bool default=false — scene 抽取失败且批内>1 条时对半递归重试（毒批拆分） [src:2293]
    sceneBatchMaxChars: 0  # int default=0 — scene 抽取前按 memoriesJson 估长贪心预分批；0=关 [src:2294]
    facts:
      enabled: false  # bool default=false — 多事实抽取块：每条记忆多产出 2-5 条自足短语（+可选三元组）落 metadata.facts，供写侧事实通道建键 [src:2026]
      maxFacts: 5  # int default=5 — 多事实短语上限；clamp 1..12（0/负/非法→5） [src:2325]
      includeTriples: false  # bool default=false — 是否把三元组展开成短语一起进 metadata [src:2326]
  write:
    factKey:
      #   #134 写面策略：生产最优档 = supersession 开 / factKey 关 / factRows 关
      enabled: false  # bool default=false — 写面事实键：L1 embedding 键=原文+分隔符+事实短语；LME90 实测负收益，生产保持关（开负收益） [src:2044]
      mode: "replace"  # enum(replace|channel) default="replace" — replace=旧键替换形态；channel=原文主索引逐位不动 + 事实短语独立向量表 l1_fact_vec [src:2340]
      separator: " | "  # str default=" | " — 原文与事实短语的拼接分隔符；空白串/null 回落默认（前后空格是键格式的一部分，不 trim） [src:2344]
      maxFactChars: 240  # int default=240 — 事实部分字符预算（整条截断，不切短语）；0=不拼接 [src:2347]
      maxFacts: 5  # int default=5 — 最多几条事实短语；clamp 1..12 [src:2325]
      includeTriples: false  # bool default=false — 三元组是否也进键 [src:2326]
      onlyForTypes: []  # list<str> default=[] — 只对这些 memory type 建事实键；[]=全类型 [src:2350]
    supersession:
      enabled: true  # bool default=true — 写时双时态：dedup 的 update/merge 把旧行从归档改为只标 valid_end（零删除）；实测 turnCov 负，生产保持关 [src:2063]
      cardinalityGate: true  # bool default=true — 先判谓词基数：多值/模态（likes/想/考虑…）一律 additive 不失效旧行，防误删唯一旧值 [src:2361]
      cardinalityDefault: "single"  # enum(single|multi) default="single" — 内容级无线索时的缺省基数；single=可失效（保覆盖），multi=保守不失效 [src:2358]
    factRows:
      enabled: false  # bool default=false — 事实行粒度：一条记忆拆成多行存储；缺省关=整行失效语义逐位不变 [src:2070]
      maxFacts: null  # int default=unset — 显式给才生效（不写则回落 factKey.maxFacts）；clamp 0..12，非法→5 [src:2325]
  persona:
    # ─── memory.persona（L2 场景） / memory.pipeline ──────────
    triggerEveryN: 50  # int default=50 — L2 场景整合触发：每 N 条对话归纳一轮场景块 [src:2379]
    maxScenes: 15  # int default=15 — L2 场景块保留上限（超出按活跃度轮转） [src:2380]
    backupCount: 3  # int default=3 — 画像备份保留份数 [src:2381]
    sceneBackupCount: 10  # int default=10 — 场景块备份保留份数 [src:2382]
    model: null  # str default=unset — L2 模型名；不写=继承 llm.model [src:2280]
    promptMode: "chat"  # enum(chat|code) default="chat" — L2 prompt 家族；缺省跟随全局 promptMode [src:2281]
    reasoningEffort: null  # str default=unset — 逐调用思考档；"none"=关深度思考（L2 p50 −65% 实测）；不写=端点默认 [src:2386]
  pipeline:
    everyNConversations: 5  # int default=5 — 每 N 轮对话触发一次 L1 提取（gateway 路径由 StatefulPipelineManager 消费） [src:2421]
    enableWarmup: true  # bool default=true — 启动预热：服务起来先补跑积压提取任务 [src:2422]
    l1IdleTimeoutSeconds: 600  # int default=600 — 会话静默 N 秒强制触发 L1（不等凑满 N 轮） [src:2423]
    l2DelayAfterL1Seconds: 10  # int default=10 — L1 完成后延迟 N 秒触发 L2（错开写入高峰） [src:2424]
    l2MinIntervalSeconds: 900  # int default=900 — L2 最小间隔（节流） [src:2425]
    l2MaxIntervalSeconds: 3600  # int default=3600 — L2 最大间隔（兜底必跑） [src:2426]
    sessionActiveWindowHours: 24  # int default=24 — 会话活跃窗口小时数：窗口内才视为可继续的同段会话 [src:2427]
  # ─── memory：存储 / 召回（主段）/ journal / 嵌入 / BM25 ──────────
  #                              [src:MemoryCore/src/config.ts]
  storeBackend: "sqlite"  # enum(sqlite) default="sqlite" — 仅剩 sqlite；tcvdb 后端已在 Wave 3 整组退场，写非 sqlite 在配置解析期直接抛错（RetiredStoreBackendError，docs/adr/0021），不再静默回落 [src:1643]
  recall:
    enabled: true  # bool default=true — 召回总开关；false=不做任何召回（注入块为空） [src:2101]
    maxResults: 10  # int default=10 — 基础召回条数上限（注入总行数硬帽；dynamicTopK 可自适应收缩） [src:2433]
    candidateK: null  # int default=unset — 混合检索上游候选池上限（两通道各取前 N 进融合）；不写=maxResults×3 逐位现状 [src:2436]
