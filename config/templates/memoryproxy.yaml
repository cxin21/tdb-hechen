# ============================================================================
# MemoryProxy 配置模板 — 端口 8096（Node 进程；启动脚本渲染成运行时副本后读取）
# 真源：MemoryProxy/src/config.ts（DEFAULT_CONFIG + 解析点）、MemoryProxy/src/types.ts、
#       MemoryProxy/src/injection/types.ts（DEFAULT_SOUL_TIMING）、
#       MemoryProxy/src/injection/injectors/wiki-recall-injector.ts（DEFAULT_WIKI_RECALL_CONFIG）。
# 逐键校验：node scripts/check-config-templates.mjs（口径见 config/SPEC.md）。
# 机器清单：config/templates/memoryproxy.keys.json（每键 type/default/env/source/consumed）。
#
# 用法：拷到 etc/proxy-config.yaml 改值；启动时 etc/tdb-services.common.ps1:New-TdbRuntimeConfig
#       （:33-58）把 ${VAR} 占位符替换成 env.ps1 的值，原子写到
#       D:/TDB/data/run/proxy-config.runtime.yaml，proxy 以 --config 读那份。未设变量原样保留，
#       落各子系统自己的 fallback（admin key 的 env 兜底在 config.ts:713-718，变量名
#       TDAI_PROXY_ADMIN_API_KEY）。整文件缺失才回退 DEFAULT_CONFIG；文件存在但解析为空 fail-fast（:187-191）。
#
# 敏感值：一律 ${ENV_NAME} 占位，真实值只进 D:/TDB/etc/env.ps1，模板与 keys.json 不落明文。
#
# 注入器挂点台账（11 个 hook + 组名门；point/priority/cacheStrategy 真源在各 injector 文件）：
#   skill             system.before_tools  prio=200(SKILL)      cache=session_init  skill-injector.ts:153/156/159
#   skill-tools       system.before_tools  prio=199(SKILL-1)    cache=session_init  skill-tools-injector.ts:200/204/207
#   knowledge-tools   system.before_tools  prio=300(WIKI)       cache=session_init  knowledge-tools-injector.ts:258/260/262
#   wiki-recall       user.before          prio=101(MEMORY+1)   cache=none          wiki-recall-injector.ts:171/172/174
#   profile-memory    system.suffix        prio=110(MEMORY+10)  cache=session_init  tdai-profile-memory-injector.ts:34/36/39
#   current-feeling   user.before          prio=102(MEMORY+2)   cache=none          tdai-current-feeling-injector.ts:36/38/41
#   tdai-tools        system.suffix        prio=105(MEMORY+5)   cache=session_init  tdai-tools-injector.ts:164/166/169
#   l1-recall         user.before          prio=100(MEMORY)     cache=none          tdai-l1-recall-injector.ts:50/51
#   soul-redline      tools.before_call    prio=100(MEMORY)     cache=none          tdai-soul-redline-event-injector.ts:79/80/83
#   soul-reanchor     tools.before_call    prio=100(MEMORY)     cache=none          tdai-soul-reanchor-injector.ts:63/64/67
#   asset-reflection  system.suffix        prio=1000(CUSTOM)    cache=none          asset-reflection-injector.ts:75/76/78
#   组名门（src/injection/index.ts）："skill"→skill+skill-tools :318-331；"knowledge"→knowledge-tools :333-341 +
#       wiki-recall :347-371；"tdai-memory"→profile/feeling/redline/reanchor :374-415 + tdai-tools :432 + l1 :435-475；
#       asset-reflection 独立门 :487-508。分发层 tools.before_call 已有 case（pipeline.ts:511），动作点注入真落地。
# ============================================================================

