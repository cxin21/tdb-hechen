# ============================================================================
# MemoryCore 配置模板 — 8420 / 单进程 standalone（deployMode: standalone）
# 真源：MemoryCore/src/config.ts（memory.* 解析）+ MemoryCore/src/gateway/config.ts（网关段）
#       + MemoryCore/src/core/skill/skill-config.ts（skill 缺省）+ MemoryCore/tdai-gateway.yaml（现网值）
#       本模板与之逐键对齐，由 scripts/check-config-templates.mjs 校验（格式契约见 config/SPEC.md）
# 用法：复制到 MemoryCore/tdai-gateway.yaml（或 TDAI_GATEWAY_CONFIG 指向的路径）后按需删段改值。
#       值列 = 源码缺省（密钥类写成 ${ENV} 占位），因此全量拷贝 = 与源码缺省同构、不改变行为；
#       唯一例外是「硬坑 A」的 0 与删键语义差别，以及被 env/config-override.json 覆盖的键。
#   注意：对象块（recall.fusion / factChannel / conclusionLayer.rerankGate 等）在本模板里是『块存在、子键为 null』，
#   与源码『整块缺键』在个别 Object.keys(x).length===0 判空处**不等价**；行为仍在缺省档，但要逐位复现
#   生产形态请整块删除（删块不影响 checker 的键集合，键仍写在本模板里）。
# 敏感值：一律 ${ENV_NAME} 占位，真实值只进 D:/TDB/etc/env.ps1
#   （占位符不会被任何加载器替换：拷贝后必须填真实值，或删掉该键走缺省/环境变量）
# 每条键的注释： # <类型> default=<源码缺省> — <作用> [src:<文件>:<行号>]
#   default=unset 表示该键可选：不写=undefined（键不存在），写 null 与不写等价。
# ============================================================================

# 段名说明：skill 是顶层段；memory.skill 是**别名位置**（gateway 把顶层 skill 浅合并后镜像到 memory.skill，
#   src/gateway/config.ts:617-624），因此运行时能看到成对的 memory.skill.* 叶子，模板只写顶层 skill。
# ─── 读这份模板前必须知道的四条（顺序即优先级）────────────────────────────────
# 1) 优先级链（左高右低）：请求级 settings（/v3/recall body.settings 等）
#      > env 读取器（MemoryCore/src/utils/env-config.ts，仅文末「env-only」列出的键）
#      > D:/TDB/data/config-override.json（白名单覆盖：llm / embedding / rerank /
#        importancePenalty / worthiness / extraction.scenePoisonSplit / extraction.sceneBatchMaxChars，
#        见 MemoryCore/src/gateway/settings-override.ts，合并点 MemoryCore/src/gateway/config.ts:501-519）
#      > 本文件 yaml > 源码缺省（MemoryCore/src/config.ts parseConfig）
#    ⇒ 改了 yaml 不见效时，先看 config-override.json 与 env.ps1，别先怀疑 yaml 没被读到。
# 2) 【硬坑 A】0 ≠ 删键：memory.recall.weights.* 的折扣/加权项（graphDiscount / sceneBoost /
#    coreRefBoost 等同族）写 0 = 显式关闭该通道；删键或写 null = 回落源码缺省（可能非 0）
#    ⇒ 通道反而被打开。要关就显式写 0，永远不要用「不写」表达关闭。
# 3) 【硬坑 B】未知枚举值 fail-secure，不回落：memory.auth.requireTeamOwnership 拼成 "enfroce"
#    ⇒ 判为 enforce（数据面 403 TEAM_NOT_OWNED）；memory.auth.unknownPrincipalPolicy 拼错 ⇒ reject；
#    memory.wiki.teamVerify 拼错 ⇒ enforce；memory.recall.injectWrapper.mode 未知 ⇒ 回落 calibrated。
#    想用缺省请写空串或删键。改档后复测两个入口：/v3/conversation/add 与 /v3/core/read。
# 4) 【硬坑 C】memory.extraction.enabled 不是有效闸：gateway 路径无条件构建 StatefulPipelineManager
#    （MemoryCore/src/gateway/server.ts:2500-2510 / :2548-2572），L1 照常入队并真的调 LLM。
#    能让后台流水线停转的是 memory.lifecycle.enabled（server.ts:2609 早退）与
#    skill.enabled（server.ts:3095-3099 池闸）。

# ─── env-only 变量（不进 yaml；读取点 MemoryCore/src/utils/env-config.ts）────────
#   MEMORY_LOG_LEVEL(:64)  MEMORY_MAX_BODY_BYTES(:79)
#   VDB_ENDPOINT/VDB_APIKEY/VDB_DATABASE/VDB_COLLECTION…(:95-:102)
#   COS_SECRET_ID/COS_SECRET_KEY/COS_REGION/COS_BUCKET…(:116-:158)
#   TDAI_API_TRACE_ENABLED(:166)  V3_STRICT_ISOLATION(:186，缺省开；未知值按开处理)
#   MEMORY_AUTH_REQUIRE_USER_BINDING(:202)  MEMORY_AUTH_UNKNOWN_PRINCIPAL_POLICY(:210)
#   MEMORY_AUTH_ADMIN_BYPASS_ENABLED(:218)  MEMORY_AUTH_REQUIRE_TEAM_OWNERSHIP(:230)
#   MEMORY_AUTH_TEAM_OWNERSHIP_WHITELIST(:238，逗号分隔；**覆盖**而非合并 yaml 白名单)
#   GATEWAY_API_KEY 由 resolveApiKey(:252) 读取；未配则本进程随机生成（重启后旧 key 全失效）
#   TDAI_SKILL_ENABLED / TDAI_SKILL_WORKER_CONCURRENCY / TDAI_GATEWAY_CONFIG / TDAI_DEPLOY_MODE /
#   STATE_BACKEND / TDAI_DATA_DIR 见 src/gateway/config.ts 的 env 读取处

# ─── 部署与进程 ───────────────────────────────
#                              [src:MemoryCore/src/gateway/config.ts]
deployMode: "standalone"  # enum(standalone|service) default="standalone" — standalone=单进程自包含(默认)；service=多租户云服务(状态外置 IStateBackend、起 TimerScanner/PipelineWorker) [src:config.ts:628]
stateBackend: null  # enum(local|redis) default=unset — 服务态后端；local=进程内文件/内存，redis=跨副本协调；不写=按 deployMode 自动(standalone→local) [src:config.ts:632]
instanceId: null  # str default=unset — 服务实例 ID：service 模式必须显式给，standalone 缺省 default；请求头 x-tdai-service-id 可逐调用覆盖 [src:config.ts:637]
server:
  port: 8420  # int default=8420 — HTTP 监听端口；env TDAI_GATEWAY_PORT 优先 [src:config.ts:434]
  host: "127.0.0.1"  # str default="127.0.0.1" — 监听地址；非回环且未配 apiKey 时启动 WARN（裸奔暴露） [src:config.ts:435]
  apiKey: "${TDAI_GATEWAY_APIKEY}"  # str default=unset — /health 之外所有路由的 Bearer 密钥；不配则启动生成临时 key（重启失效，日志 loud 打印）；env 优先 [src:config.ts:445]
  corsOrigins: []  # list<str> default=[] — CORS 白名单；[]=不发 Access-Control-* 头（最严，缺省）；["*"]=放行全部(仅本地) [src:config.ts:981]
data:
  baseDir: null  # path default=unset — 数据根：sqlite/vectors/journal/skills/config-override.json 都在其下；env TDAI_DATA_DIR 优先 [src:config.ts:450]
llm:
  # ─── LLM（顶层）──────────────────────────────
  #  优先级：config-override.json > yaml > TDAI_LLM_* env(普通字段)，见上方优先级段
  #                              [src:MemoryCore/src/gateway/config.ts]
  baseUrl: "https://api.openai.com/v1"  # str default="https://api.openai.com/v1" — LLM 端点（OpenAI 兼容）；env TDAI_LLM_BASE_URL 优先；provider=proxy 时运行期拼 /proxy/<iid>/v1 [src:config.ts:467]
  apiKey: "${TDAI_LLM_API_KEY}"  # str default="" — LLM 密钥；实际 SoT=config-override.json(admin settings)，yaml 次之，env TDAI_LLM_API_KEY 仅弃用回退 [src:config.ts:470]
  model: "gpt-4o"  # str default="gpt-4o" — 默认模型名；env TDAI_LLM_MODEL 优先 [src:config.ts:471]
  maxTokens: 4096  # int default=4096 — 单次 LLM 输出 token 上限；0=不限制（reasoning 模型建议 0，4096 帽会截成空响应） [src:config.ts:472]
  timeoutMs: 120000  # ms default=120000 — 单次 LLM 调用超时毫秒 [src:config.ts:473]
  provider: "openai"  # enum(openai|proxy) default="openai" — openai=直连兼容端点；proxy=走 context_proxy 且 Authorization 用 memory 系统用户 key [src:config.ts:463]
  stream: false  # bool default=false — 是否流式；env TDAI_LLM_STREAM=true/false 可覆盖（显式关也可） [src:config.ts:480]
  proxy:
    useMemorySystemUserKey: true  # bool default=true — provider=proxy 时用 metadata 里 memory 系统用户的 userKey 作为 Authorization [src:config.ts:476]
redis:
  # ─── 服务态后端（仅 deployMode=service / stateBackend=redis 需要）──────
  host: "127.0.0.1"  # str default="127.0.0.1" — Redis 地址（stateBackend=redis 时必填） [src:config.ts:643]
  port: 6379  # int default=6379 — Redis 端口 [src:config.ts:644]
  password: "${REDIS_PASSWORD}"  # str default=unset — Redis 密码；不配=无鉴权 [src:config.ts:645]
  db: 0  # int default=0 — Redis 逻辑库号 [src:config.ts:646]
  keyPrefix: "tdai_memory_v2"  # str default="tdai_memory_v2" — 键前缀；v2 起与旧 tdai_memory 物理隔离（锁 hash tag 语义变更，混跑会破坏互斥） [src:config.ts:651]
shark:
  baseUrl: null  # str default=unset — Shark 远端配置服务地址（service 模式拉实例配置） [src:config.ts:657]
  vdbTtlMs: 300000  # ms default=300000 — 远端 VDB 配置缓存 TTL [src:config.ts:658]
  cosBufferMs: 120000  # ms default=120000 — COS 配置缓冲刷新间隔 [src:config.ts:659]
  maxInstances: 1000  # int default=1000 — 本地缓存的实例上限（store maxStores 同源） [src:config.ts:660]
scanner:
  instances: "default"  # str default="default" — TimerScanner 扫描实例列表（逗号分隔） [src:config.ts:666]
  instancesSharkUrl: null  # str default=unset — 从 Shark 动态拉实例列表的地址；配了则覆盖 instances [src:config.ts:667]
  intervalMs: 500  # ms default=500 — 扫描周期；越小定时任务越准时、DB 压力越大 [src:config.ts:668]
  nodeId: null  # str default=unset — 节点 ID（多副本分片认领，缺省按主机生成） [src:config.ts:669]
worker:
  pollMs: 200  # ms default=200 — PipelineWorker 轮询间隔 [src:config.ts:675]
  concurrency: 60  # int default=60 — worker 并发协程数；调大提吞吐也压 DB/LLM 配额 [src:config.ts:676]
cos:
  domain: null  # str default=unset — COS 访问域名（自定义 CDN 时配） [src:config.ts:682]
  generationLogRetentionDays: 30  # int default=30 — 生成日志保留天数；0=关闭生命周期管理；非负整数，非法直接启动抛错 [src:config.ts:683]
observability:
  otel:
    # ─── 可观测性（本地三件套全关）──────────────
    enabled: false  # bool default=false — OTel SDK（trace+log）总开关；env TDAI_OTEL_ENABLED 兜底 [src:config.ts:697]
    endpoint: "http://localhost:4317"  # str default="http://localhost:4317" — OTLP collector 地址 [src:config.ts:700]
    protocol: "grpc"  # enum(grpc|http/protobuf) default="grpc" — OTLP 传输协议 [src:config.ts:701]
    serviceName: "core"  # str default="core" — service.name 资源属性 [src:config.ts:702]
    serviceVersion: "1.0.0"  # str default="1.0.0" — service.version 资源属性 [src:config.ts:703]
    tenantId: ""  # str default="" — 智研 APM 租户 ID [src:config.ts:704]
    logExportInterval: 5  # int default=5 — 日志导出批量间隔（秒） [src:config.ts:705]
  clickhouse:
    enabled: false  # bool default=false — ClickHouse 双写开关 [src:config.ts:711]
    endpoint: ""  # str default="" — ClickHouse HTTP 端点 [src:config.ts:714]
    username: "default"  # str default="default" — ClickHouse 用户名 [src:config.ts:715]
    password: "${CLICKHOUSE_PASSWORD}"  # str default="" — ClickHouse 密码 [src:config.ts:716]
    database: "tdai_eval"  # str default="tdai_eval" — ClickHouse 库名 [src:config.ts:717]
  kafka:
    enabled: false  # bool default=false — Kafka 指标上报开关；配了 brokers 时缺省自动 true [src:config.ts:725]
    brokers: ""  # str default="" — broker 列表（逗号分隔），内部会 split 成数组 [src:config.ts:723]
    topic: "memory_monitor"  # str default="memory_monitor" — 指标 topic [src:config.ts:724]
  langfuse:
    enabled: false  # bool default=false — Langfuse LLM trace 上报开关 [src:config.ts:733]
    host: ""  # str default="" — Langfuse 实例地址 [src:config.ts:736]
    publicKey: "${LANGFUSE_PUBLIC_KEY}"  # str default="" — Langfuse 公钥 [src:config.ts:737]
    secretKey: "${LANGFUSE_SECRET_KEY}"  # str default="" — Langfuse 私钥 [src:config.ts:738]
metadata:
  # ─── 元数据模块（users/teams/存储）──────────
  maxUsersPerInstance: 500  # int default=500 — 单实例用户配额；<=0 回落 500 [src:config.ts:761]
  maxTeamsPerInstance: 100  # int default=100 — 单实例 team 配额；<=0 回落 100 [src:config.ts:765]
  configParamsFile: null  # path default=unset — metadata config params JSON 文件路径（env TDAI_METADATA_CONFIG_PARAMS_FILE 优先） [src:config.ts:769]
  store:
    sqliteBaseDir: null  # path default=unset — metadata sqlite 根目录（缺省 {data.baseDir}/metadata） [src:config.ts:753]
    mongoUri: null  # str default=unset — Mongo 连接串；配了走 Mongo 适配器 [src:config.ts:754]
    mongoTransactions: true  # bool default=true — 是否用 Mongo 事务（需副本集） [src:config.ts:755]
    storeCacheMaxInstances: null  # int default=unset — metadata store 进程内缓存实例上限 [src:config.ts:756]
    mongoDbPrefix: "tdai_metadata"  # str default="tdai_metadata" — Mongo 库名前缀，库名 = {prefix}_{instance_id} [src:config.ts:757]
  systemUser:
    memory:
      userId: null  # str default=unset — 内部 memory 系统用户 user_id（仅 auth/verify，不落库） [src:config.ts:775]
      displayName: null  # str default=unset — 系统用户显示名 [src:config.ts:776]
      userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}"  # str default=unset — 系统用户 userKey（llm.provider=proxy 时作为 Authorization 凭据） [src:config.ts:777]
offload:
  # ─── 网关级 offload 执行器（与 memory.offload 不是同一块！）──────
  forceTriggerThreshold: 4  # int default=4 — pending 积压到多少条强制触发 offload [src:config.ts:785]
  pendingMaxAgeSeconds: 30  # int default=30 — pending 任务最大存活秒数，超龄重投 [src:config.ts:786]
  l1Temperature: 0.3  # float default=0.3 — offload L1 摘要温度 [src:config.ts:787]
  l1MaxTokens: 8000  # int default=8000 — offload L1 输出上限 [src:config.ts:788]
  l1TimeoutMs: 120000  # ms default=120000 — offload L1 超时 [src:config.ts:789]
  l15Temperature: 0.2  # float default=0.2 — offload L1.5 温度 [src:config.ts:790]
  l15MaxTokens: 3000  # int default=3000 — offload L1.5 输出上限 [src:config.ts:791]
  l15TimeoutMs: 120000  # ms default=120000 — offload L1.5 超时 [src:config.ts:792]
  l2Temperature: 0.4  # float default=0.4 — offload L2 温度 [src:config.ts:793]
  l2MaxTokens: 16000  # int default=16000 — offload L2 输出上限 [src:config.ts:794]
  l2TimeoutMs: 120000  # ms default=120000 — offload L2 超时 [src:config.ts:795]
  l2NullThreshold: 6  # int default=6 — 连续 N 次 L2 空结果即判定无效 [src:config.ts:796]
  mildOffloadRatio: 0.5  # float default=0.5 — 上下文占用达此比例触发轻度压缩 [src:config.ts:797]
  aggressiveCompressRatio: 0.85  # float default=0.85 — 达此比例触发激进压缩 [src:config.ts:798]
  emergencyCompressRatio: 0.95  # float default=0.95 — 达此比例触发应急压缩 [src:config.ts:799]
  maxRetries: 3  # int default=3 — offload 任务重试次数上限 [src:config.ts:800]
memory:
  # ─── memory：prompt / 捕获 / 抽取 / 写面 / 场景 / 管线 ──────────
  #                              [src:MemoryCore/src/config.ts（c = yaml 的 memory 段）]
  promptMode: "chat"  # enum(chat|code) default="chat" — 全局 prompt 家族；chat=对话体、code=代码体；组级 extraction.promptMode/persona.promptMode 可覆盖；顶层 promptMode 与 prompts.mode 是别名 [src:config.ts:1466]
  capture:
    enabled: true  # bool default=true — L0 捕获总开关：每轮 user/assistant 消息写短期记忆；关=不落 L0（抽取无原料） [src:config.ts:2161]
    excludeAgents: []  # list<str> default=[] — 不捕获的 agent 名单（按 agent_id 精确匹配） [src:config.ts:2162]
    l0l1RetentionDays: 0  # int default=0 — L0/L1 保留天数；<=0=关闭清理；1~2 天须同时开 allowAggressiveCleanup 才生效；>=3 直接生效 [src:config.ts:2163]
    allowAggressiveCleanup: false  # bool default=false — 允许 retentionDays<3 的激进清理（1~2 天） [src:config.ts:1473]
    cleanTime: "03:00"  # str default="03:00" — 每日清理时刻 HH:mm（本地时区）；格式非法回落 03:00 [src:config.ts:1581]
  extraction:
    enabled: true  # bool default=true — L1 抽取总开关（注意：gateway 路径下不是有效闸，只影响 legacy manaCTD；真闸是 pipeline/lifecycle） [src:config.ts:2167]
    enableDedup: true  # bool default=true — 入库前 LLM 判重合并（相似记忆合并防膨胀） [src:config.ts:2168]
    maxMemoriesPerSession: 20  # int default=20 — 单会话单批最多抽取条数（防 LLM 失控灌库） [src:config.ts:2169]
    sessionScope: "session"  # enum(session|profile) default="session" — 抽取语料会话范围；session=只抽最靠前的一个 session_id（其余延后，零丢行）；profile=旧多会话同批；非法值回落 session [src:config.ts:2171]
    durativeEnabled: false  # bool default=false — 持续性状态事实写 valid_start（缺省关=prompt 字节不变） [src:config.ts:2173]
    recurrenceEnabled: false  # bool default=false — 周期性事实 RECURRENCE_BLOCK 提取（LLM 只提议、确定性门裁决） [src:config.ts:2175]
    model: null  # str default=unset — 抽取专用模型名；不写=继承 llm.model [src:config.ts:2176]
    promptMode: "chat"  # enum(chat|code) default="chat" — 抽取 prompt 家族；缺省跟随全局 promptMode [src:config.ts:2177]
    extractionTimeoutMs: 300000  # ms default=300000 — 单批抽取超时；clamp [60000,3600000]（毒批 300s 悬挂堆积的根修） [src:config.ts:2179]
    dedupTimeoutMs: 300000  # ms default=300000 — 判重 LLM 超时；clamp [60000,3600000]；超时走 storeAllDirectly 降级 [src:config.ts:2184]
    ignoreSessionPatterns: ["probe-","session-probe-"]  # list<str> default=["probe-","session-probe-"] — 命中这些模式的会话不参与 L1 抽取、不计 batch；匹配=前缀+* 通配，对 session_id 与 sessionKey 双生效；写 []=关闸 [src:config.ts:2190]
    scenePoisonSplit: false  # bool default=false — scene 抽取失败且批内>1 条时对半递归重试（毒批拆分） [src:config.ts:2192]
    sceneBatchMaxChars: 0  # int default=0 — scene 抽取前按 memoriesJson 估长贪心预分批；0=关 [src:config.ts:2193]
    facts:
      enabled: false  # bool default=false — 多事实抽取块：每条记忆多产出 2-5 条自足短语（+可选三元组）落 metadata.facts，供写侧事实通道建键 [src:config.ts:2198]
      maxFacts: 5  # int default=5 — 多事实短语上限；clamp 1..12（0/负/非法→5） [src:config.ts:2199]
      includeTriples: false  # bool default=false — 是否把三元组展开成短语一起进 metadata [src:config.ts:2200]
  write:
    factKey:
      #   #134 写面策略：生产最优档 = supersession 开 / factKey 关 / factRows 关
      enabled: false  # bool default=false — 写面事实键：L1 embedding 键=原文+分隔符+事实短语；LME90 实测负收益，生产保持关（开负收益） [src:config.ts:2212]
      mode: "replace"  # enum(replace|channel) default="replace" — replace=旧键替换形态；channel=原文主索引逐位不动 + 事实短语独立向量表 l1_fact_vec [src:config.ts:2214]
      separator: " | "  # str default=" | " — 原文与事实短语的拼接分隔符；空白串/null 回落默认（前后空格是键格式的一部分，不 trim） [src:config.ts:2217]
