name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  memorycore-test:
    runs-on: ubuntu-latest
    # #66 persona-eval LLM 实跑凭据（secrets 未配置时为空串 → 冒烟步自动 skip 注记，设计 §2.5 fallback 纪律）
    env:
      TDAI_GATEWAY_API_KEY: ${{ secrets.TDAI_GATEWAY_API_KEY }}
      TDAI_GATEWAY_BASE_URL: ${{ secrets.TDAI_GATEWAY_BASE_URL }}
      TDAI_GATEWAY_MODEL: ${{ secrets.TDAI_GATEWAY_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 仓库纪律（.gitignore:32-35）：lockfile 不入库（dev-only）——CI 无 frozen 安装、无依赖缓存
      # --ignore-scripts：openclaw 依赖链 preinstall 在 CI 沙箱失败（本地 patch 脚本本有 || true 兜底）；
      # esbuild 平台二进制走 optionalDependencies 分发，源码 vitest 门不受影响
      - name: Install
        working-directory: MemoryCore
        run: pnpm install --ignore-scripts
      - name: Redline subset probes (PR gate, #48)
        working-directory: MemoryCore
        run: pnpm exec vitest run src/core/hooks/__tests__/soul-identity-probes.test.ts -t "红线子集"
      # ── #66 R2 行为级人格回归评测（persona-eval）PR 门禁 ──
      - name: Persona-eval corpus validate (#66)
        working-directory: MemoryCore
        run: pnpm exec tsx scripts/persona-eval/validate-corpus.ts
      # 零成本确定性干跑：语料 schema 全库校验（26 探针）+ smoke 选样（smoke:true ≤10 覆盖 6 维）+ 调用计划，不调 LLM
      - name: Persona-eval corpus dry-run gate (#66, zero-cost)
        working-directory: MemoryCore
        run: pnpm run judge:behavior:smoke -- --no-llm
      # LLM 实跑冒烟（≤10 探针 / ≤20 调用，runner 双硬保）；secrets 未配置时由下一行 skip 注记（key 永不入库）
      - name: Persona-eval smoke run (LLM, ≤10 probes ≤20 calls, #66)
        if: ${{ env.TDAI_GATEWAY_API_KEY != '' }}
        working-directory: MemoryCore
        run: |
          set -euo pipefail
          cat > /tmp/tdai-gateway-ci.yaml <<EOF
          llm:
            baseUrl: "${TDAI_GATEWAY_BASE_URL}"
            apiKey: "${TDAI_GATEWAY_API_KEY}"
            model: "${TDAI_GATEWAY_MODEL:-default}"
            timeoutMs: 120000
          EOF
          pnpm run judge:behavior:smoke -- --config /tmp/tdai-gateway-ci.yaml --no-soul \
            --out /tmp/persona-smoke.jsonl --summary /tmp/persona-smoke-summary.json
          cat /tmp/persona-smoke-summary.json
      - name: Persona-eval smoke skip note (no TDAI_GATEWAY_API_KEY, #66)
        if: ${{ env.TDAI_GATEWAY_API_KEY == '' }}
        run: |
          echo "::notice::persona-eval LLM smoke skipped: TDAI_GATEWAY_API_KEY secret not configured. 本地验收命令见 MemoryCore/scripts/persona-eval/README.md（设计 §2.5 CI 无 secrets fallback 纪律）"
      - name: Full test suite
        working-directory: MemoryCore
        run: pnpm exec vitest run

  memoryproxy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: MemoryProxy
        run: pnpm install
      - name: Typecheck
        working-directory: MemoryProxy
        run: pnpm exec tsc --noEmit
      - name: Full test suite
        working-directory: MemoryProxy
        run: pnpm exec vitest run

  panel-format:
    # #106 格式门禁：prettier --check 必须绿（格式修复与门禁同 PR，落地即绿）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # lockfile 不入库（仓库纪律）——无 frozen 安装；prettier 无原生依赖，--ignore-scripts 足够
      - name: Install
        working-directory: MemoryPanel/web
        run: pnpm install --ignore-scripts
      - name: Prettier format gate (#106)
        working-directory: MemoryPanel/web
        run: pnpm run format:check
